# The regression suite.
#
#     aiq-lean gates run --config dev/policy/gate-suite.yaml
#     aiq-lean gates run --config dev/policy/gate-suite.yaml --fast   # skip Lean builds
#     aiq-lean gates list --config dev/policy/gate-suite.yaml
#
# Two kinds of gate appear here:
#
#   * **declared** gates below -- installed `aiq-lean` commands plus a policy
#     file in this directory.  These are the generic engines; the repository
#     owns the policy, the package owns the mechanism.
#   * **discovered** `scripts/check_*.py`, which are the checks that encode
#     Davis--Kahan / Tau Ceti / Palomar scientific and release policy and have no
#     generic form.  The runner reads each one's `argparse` setup to decide
#     whether `--check` means "be strict" there, so a soft check is strict at the
#     point of use without every script changing.
#
# **Do not run `lake` while this is running.**  Several gates invoke it and a
# concurrent build makes them fail with `build failed`, which reads exactly like
# a regression and is not one.  `--fast` skips exactly those.
pattern: scripts/check_*.py
unavailable_exit_code: 3

slow:
  - check_comparator_signatures
  - foundations
  - statement-pins-dk
  - statement-pins-yws
  - statement-pins-quench
  - statement-pins-acharyya-2024
  - statement-pins-acharyya-2025
  - statement-pins-helm-2025

# Kept empty deliberately.  A check whose output nobody acts on is worse than no
# check -- it trains everyone to ignore the suite -- and "advisory" is the
# mechanism that lets such checks accumulate instead of being removed.  If you
# find yourself wanting an entry here, delete the check instead.
advisory: {}

# Gates where `--check` means a stronger, aspirational criterion rather than the
# soft/strict toggle it is elsewhere, so the runner withholds the flag.  Empty
# since 2026-08-27; the mechanism costs nothing and documents the limit of
# deriving strictness from `argparse`.
check_is_stronger: {}

gates:
  - name: import-layers
    command: ["aiq-lean", "imports", "check", "dev/policy/import-layers.yaml"]
    description: "library layering firewall"

  - name: namespaces
    command: ["aiq-lean", "namespaces", "check", "dev/policy/namespaces.yaml"]
    description: "which namespaces a module may declare into"

  - name: ratchets
    command: ["aiq-lean", "ratchet", "check", "dev/policy/ratchet.yaml"]
    description: "@[expose] counts in ForTauCeti"

  - name: conflict-markers
    command: ["aiq-lean", "source", "conflicts", "--check"]
    description: "committed merge-conflict markers in any tracked file"

  - name: orphan-artifacts
    command: ["aiq-lean", "source", "orphan-artifacts", "--check"]
    description: "Lake build products whose Lean source is gone"

  - name: duplicate-names
    command: ["aiq-lean", "source", "duplicates",
              "--prefix", "ForTauCeti", "--prefix", "DavisKahan",
              "--exclude-prefix", "DavisKahan.Experimental",
              "--check"]
    description: "one fully-qualified name must come from one module"

  - name: private-shadows
    command: ["aiq-lean", "source", "private-shadows",
              "--prefix", "ForTauCeti", "--prefix", "DavisKahan", "--prefix", "Challenge",
              "--baseline", "dev/policy/private-shadow-baseline.json",
              "--check"]
    description: "a private declaration repeating one its module already imports"

  - name: docstring-coverage
    command: ["aiq-lean", "source", "docstrings",
              "--prefix", "ForTauCeti", "--prefix", "DavisKahan",
              "--exclude-prefix", "DavisKahan.Experimental",
              "--baseline", "dev/policy/docstring-baseline.json",
              "--check"]
    description: "every public declaration on the submission surface carries a docstring"

  - name: aggregates
    command: ["aiq-lean", "source", "aggregates",
              "--base", "DavisKahan", "--library", "DavisKahan",
              "--skip-dir", "Audits",
              "--root-import", "DavisKahan",
              "--header-file", "dev/policy/aggregate-header.txt",
              "--check"]
    description: "DavisKahan.All reaches the production tree by construction"

  - name: workspace-ledgers
    command: ["aiq-lean", "workspace", "validate", "--static-declarations"]
    description: "every source census, semantic review and coverage inventory, validated together"

  - name: foundations
    command: ["aiq-lean", "foundations", "validate",
              "dev/davis-kahan-hidden-foundations.json", "--lean-probe"]
    description: "the hidden-foundation ledger is internally valid and Lean resolves every declaration it names -- NOT a completeness claim; its `interface` nodes are open campaigns"

  - name: foundations-status
    command: ["aiq-lean", "foundations", "render",
              "dev/davis-kahan-hidden-foundations.json",
              "-o", "dev/davis-kahan-hidden-foundations-status.md", "--check"]
    description: "the generated foundation-status view is current"

  - name: statement-pins-dk
    command: ["aiq-lean", "alignment", "check",
              "dev/davis-kahan-1970-full-source-census.json"]
    description: "every Davis--Kahan declaration a headline semantic review accepted still has the elaborated type it accepted"

  - name: statement-pins-yws
    command: ["aiq-lean", "alignment", "check",
              "dev/yu-wang-samworth-2015-full-source-census.json"]
    description: "every Yu--Wang--Samworth declaration a semantic review accepted still has the elaborated type it accepted -- a moved structural hash means the review is describing a statement that is no longer there"

  - name: statement-pins-quench
    command: ["aiq-lean", "alignment", "check",
              "dev/quench-2026-result-semantic-review.json"]
    description: "the same for the Quench 2026 standalone review, which pins every declaration its rows cite"

  - name: statement-pins-acharyya-2024
    command: ["aiq-lean", "alignment", "check",
              "dev/acharyya-2024-result-semantic-review.json"]
    description: "the same for the Acharyya 2024 standalone review; it pins both halves -- the elaborated types and the transcription passages its rows cite"

  - name: statement-pins-acharyya-2025
    command: ["aiq-lean", "alignment", "check",
              "dev/acharyya-2025-result-semantic-review.json"]
    description: "the same for the Acharyya 2025 standalone review"

  - name: statement-pins-helm-2025
    command: ["aiq-lean", "alignment", "check",
              "dev/helm-2025-result-semantic-review.json"]
    description: "the same for the Helm 2025 standalone review"

  - name: grounding-yws
    command: ["aiq-lean", "source", "grounding", "dev/policy/yu-wang-samworth-grounding.yaml"]
    description: "the Yu--Wang--Samworth lane still contains its mathematics, and no placeholders"

