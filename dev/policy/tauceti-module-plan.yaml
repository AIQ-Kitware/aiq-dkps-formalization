# The proposed Tau Ceti submission decomposition of `ForTauCeti`.
#
# Checked by `aiq-lean source module-plan dev/policy/tauceti-module-plan.yaml`.
# Replaces the `TOPICS` table in `scripts/check_tauceti_roadmap_topics.py` and the
# `RUNGS` table in `scripts/derive_tauceti_submission_ladder.py`, which held the
# same editorial decisions as Python literals.
#
# `topics` partitions every maintained `ForTauCeti` module into fine-grained
# topics, ordered so that each is reviewable on its own against a base Tau Ceti has
# already accepted.  The checker enforces three properties, each of which the first
# hand-drawn draft violated:
#
#   * **total** -- every module is assigned to exactly one topic.  A design that
#     quietly omits modules is how 115 of 156 modules ended up with no submission
#     path at all.
#   * **disjoint** -- no module is claimed by two topics.
#   * **acyclic in submission order** -- no module imports anything assigned to a
#     later topic.  A forward reference means the PR cannot compile against what
#     Tau Ceti has accepted so far.  The first draft had 24 and the second had 12;
#     each fix was a fact about the mathematics, not a bookkeeping slip.
#
# `rungs` are editorial submission seeds.  Each rung is expanded to its cumulative
# source-import closure before new and off-ladder modules are reported: source
# import edges are planning evidence, not declaration-level proof dependencies.
#
# Topic membership and order, and the rung seeds, are decisions.  Everything
# derived from them -- prerequisites, closures, forward references -- is not.
library: ForTauCeti
source_dir: .
require_total_topics: true
require_total_ladder: false
