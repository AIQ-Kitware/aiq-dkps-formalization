<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="326" viewBox="0 0 1060 326">
<desc>Adaptation of Manim S10Sharp scene: sharp rank-one sine-theta model. The left vertical component is sin(theta), the residual vector on the right has length delta sin(theta).</desc>
