name = "aiq_dkps_formalization"
version = "0.1.0"
keywords = ["math", "formalization", "DKPS", "MDS", "spectral-perturbation"]
# The ordinary build is the complete claimed-mathematics build.  Admission-
# dependent API experiments are available explicitly as DavisKahan.Experimental.
defaultTargets = ["ForTauCeti", "RoadmapBridge", "DavisKahan.All", "FinishYuWangSamworth", "Acharyya2024", "Acharyya2025", "DkpsQuench2026", "Helm2025"]

# Standalone Lean workspace for Davis--Kahan and four DKPS paper developments.
# The libraries share one Mathlib checkout/build and are intentionally kept as
# separate top-level Lean libraries so each paper-facing theorem layer can be
# built or imported independently.

[leanOptions]
pp.unicode.fun = true
# Avoid accidental free variables in theorem statements.
autoImplicit = false



# BEGIN Tau Ceti local dependency
# `external/TauCeti` is the checked-in upstream target used for compatibility
# checks and extraction work. `ForTauCeti` is the maintained reusable-math
# package in this repository; its declarations already live in final `TauCeti.*`
# namespaces.
[[require]]
name = "TauCeti"
path = "external/TauCeti"
# END Tau Ceti local dependency

# BEGIN authoritative root Mathlib dependency
# Keep this requirement last among all [[require]] blocks so this workspace owns
# the Mathlib pin used by every local library and the Tau Ceti checkout.
[[require]]
name = "mathlib"
scope = "leanprover-community"
# END authoritative root Mathlib dependency

# ForTauCeti: the reusable-mathematics package. Declarations live in their final
# `TauCeti.*` namespaces. A ForTauCeti module may import only `Mathlib.*`,
# `TauCeti.*`, and `ForTauCeti.*` (enforced by scripts/check_dependency_layers.py).
# The glob builds every file even when no aggregate imports it. Current package
# policy and provenance requirements live in ForTauCeti/README.md.
[[lean_lib]]
name = "ForTauCeti"
globs = ["ForTauCeti.*"]
# Mirror the options Tau Ceti's own `lean_lib` applies so local validation uses
# the same warning/style policy as the upstream target. `warningAsError` prevents
# local warning regressions from being hidden by this workspace's defaults.
leanOptions = { warningAsError = true, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, weak.linter.style.header = false }

# The roadmap bridge. The submitted roadmap
# (`submodules/TauCetiRoadmap/**/Suggested.lean`) states the proposed signatures against
# Mathlib alone with `sorry` bodies; `ForTauCeti` proves the mathematics.  Each module here
# restates a roadmap signature verbatim and discharges it with the delivered declaration, so
# the correspondence is checked by the compiler rather than by comparing declaration names.
#
# In `defaultTargets` deliberately so the roadmap-to-delivery correspondence is
# re-verified by every ordinary build.
[[lean_lib]]
name = "RoadmapBridge"
globs = ["RoadmapBridge.*"]

[[lean_lib]]
name = "DavisKahan"

[[lean_lib]]
name = "Acharyya2024"

[[lean_lib]]
name = "Acharyya2025"

[[lean_lib]]
name = "DkpsQuench2026"

[[lean_lib]]
name = "Helm2025"

# Mathematics-first completion workspace for the sharp tan(2Theta) theory.
# `lake build FinishTanTwoTheta` follows the aggregate module's real proof
# closure.  Refuted or still-open research extensions remain individually
# buildable by module name, but are not glob-built as completed theorems.
[[lean_lib]]
name = "FinishTanTwoTheta"
srcDir = "FinishTanTwoTheta"


# Paper-facing Yu--Wang--Samworth (2015) formalization package. The source
# is isolated organizationally but shares the root dependency graph and .lake.
#
# Kept in `defaultTargets` so the paper's headline results and grounding ledger
# remain guarded by the ordinary build. See FinishYuWangSamworth/README.md and the
# maintained source census for current coverage.
[[lean_lib]]
name = "FinishYuWangSamworth"
srcDir = "FinishYuWangSamworth"
globs = ["FinishYuWangSamworth.*"]
# Measured against the option set Tau Ceti's own `lean_lib` applies, not this
# repository's default: `warningAsError` alone says nothing about whether an
# upstream PR would be accepted. Mirrors the `ForTauCeti` block above, including
# `style.header = false` (Tau Ceti disables the copyright-header linter).
leanOptions = { warningAsError = true, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, weak.linter.style.header = false }


# Comparator/challenge modules for community calibration of AI-authored
# upstream candidates. These are intentionally not default targets.
[[lean_lib]]
name = "Challenge"
globs = ["Challenge.*"]
