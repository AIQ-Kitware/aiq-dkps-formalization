name = "aiq_dkps_formalization"
version = "0.1.0"
keywords = ["math", "formalization", "DKPS", "MDS", "spectral-perturbation"]
# The ordinary build is the complete claimed-mathematics build.  Admission-
# dependent API experiments are available explicitly as DavisKahan.Experimental.
defaultTargets = ["ForTauCeti", "RoadmapBridge", "DavisKahan.All", "Acharyya2024", "Acharyya2025", "DkpsQuench2026", "Helm2025"]

# Standalone Lean workspace for Davis--Kahan and four DKPS paper developments.
# The libraries share one Mathlib checkout/build and are intentionally kept as
# separate top-level Lean libraries so each paper-facing theorem layer can be
# built or imported independently.

[leanOptions]
pp.unicode.fun = true
# Avoid accidental free variables in theorem statements.
autoImplicit = false




# ForMathlib is RETIRED (lane FM-RETIRE, 2026-07-29).  Its four surviving modules moved
# into ForTauCeti and the library, its root module and its directory are deleted.
# See ForTauCeti/README.md.

# Spectra: RETIRED and REMOVED 2026-07-30 (lane SPECTRA-FORK).  Nothing in this
# repository imports Spectra.  The vendored source is gone; everything this project
# did on top of it is `retired/patches-Spectra/0002-dkps-complete-fork.patch`, which
# was verified to reconstruct the deleted tree byte-for-byte from upstream commit
# 8dbaaf6728d1342ae16acf79fd7eef7c59b37e63.  See that directory's README to rebuild.


# BEGIN Tau Ceti local dependency (Milestone 2 extraction target)
# Tau Ceti is the permanent generic-mathematics library the reusable Davis--Kahan
# foundations are migrating into: the target architecture is
# `Mathlib -> TauCeti -> DavisKahan`, staged through the temporary `ForTauCeti`
# library.  This is a local path dependency onto the checked-in submodule so the
# post-merge dependency switch can be simulated locally.  Like Spectra, TauCeti's
# own `mathlib` requirement is overridden by the authoritative root pin below
# (the root pin is newer; see dev/tauceti/migration-baseline-2026-07-24.md).
[[require]]
name = "TauCeti"
path = "external/TauCeti"
# END Tau Ceti local dependency

# BEGIN authoritative root Mathlib dependency
# Keep this requirement last among all [[require]] blocks. Spectra currently
# pins an older Mathlib dependency graph; the root DKPS pins must win.
[[require]]
name = "mathlib"
scope = "leanprover-community"
# END authoritative root Mathlib dependency

# ForTauCeti: the reusable-mathematics package.  Declarations live in their final
# `TauCeti.*` namespaces.  A ForTauCeti module may import only `Mathlib.*`,
# `TauCeti.*`, and `ForTauCeti.*` (enforced by scripts/check_dependency_layers.py).
# The glob builds every file even when no aggregate imports it, mirroring Tau
# Ceti's own source-tree glob.
#
# EXECUTIVE DECISION -- JON, 2026-07-29.  Two rulings, both his, both binding:
#   (a) ForTauCeti is THE PRODUCT: an elegant package that polished roadmaps are
#       generated from, and that mechanical ports are then built to satisfy.
#   (b) It is NOT a holding pen and it is NOT deleted at the end.  There is no
#       terminal state in which it is empty.
# This SUPERSEDES the previous comment here, which read "the successful terminal
# state of the campaign is an empty/deleted ForTauCeti".  Kept struck rather than
# erased so the reversal is legible: ~~empty/deleted ForTauCeti~~.
#
# THIS MISTAKE HAS NOW BEEN MADE TWICE BY AGENTS (jon, 2026-07-29).  If you are
# about to write a lane, a task, or a doc that ends in deleting ForTauCeti or in
# draining it into external/TauCeti -- stop.  Read ForTauCeti/README.md and
# AGENTS.md first.
# See ForTauCeti/README.md.
[[lean_lib]]
name = "ForTauCeti"
globs = ["ForTauCeti.*"]
# Mirror the options Tau Ceti's own `lean_lib` applies (see
# `external/TauCeti/lakefile.toml`), so that the staging library is measured against the
# rules that will actually gate the PR rather than against this repository's laxer default.
# Without these, "`lake build ForTauCeti` is warning-free" is true here and says nothing
# about upstream: the census under these options was 78 when the default set reported 0.
# It is now 0, and `warningAsError` is on so it cannot silently regress -- a warning here
# is a warning Tau Ceti's CI would reject.
leanOptions = { warningAsError = true, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, weak.linter.style.header = false }

# The roadmap's suggested-signature files.  A library rather than a gate script, for the
# reason the defect record gives: they were broken for an unknown length of time -- ten
# elaboration errors across three of the six -- because nothing built them, and a library
# is the mechanism that makes `lake build` the signal instead of a separate command
# nobody remembers to run.
#
# `warningAsError` is deliberately OFF, unlike the `ForTauCeti` block above.  Every
# declaration in these files is a `sorry`: that is what a suggested signature *is*, and
# turning "declaration uses `sorry`" into an error would make the library unbuildable by
# construction.  The linters stay on, so a genuine style regression still shows up.
#
# Not in `defaultTargets`: these are drafts for a reviewer, not submission material, so
# `lake build` with no argument leaves them alone.  Build them with
# `lake build ForTauCetiRoadmap`.
[[lean_lib]]
name = "ForTauCetiRoadmap"
globs = ["ForTauCetiRoadmap.*"]
leanOptions = { warningAsError = false }

# The roadmap bridge.  `ForTauCetiRoadmap` states the proposed signatures against Mathlib
# alone with `sorry` bodies; `ForTauCeti` proves the mathematics; nothing connected the two,
# so "delivered" was decided by comparing declaration *names* across the two trees.  Each
# module here restates a roadmap signature verbatim and discharges it with the delivered
# declaration, so the correspondence is checked by the compiler.
#
# In `defaultTargets` deliberately, unlike `ForTauCetiRoadmap`: the whole point is that the
# claim is re-verified on every build.  A bridge outside the default build would rot exactly
# the way the suggested-signature files did.
[[lean_lib]]
name = "RoadmapBridge"
globs = ["RoadmapBridge.*"]

[[lean_lib]]
name = "DavisKahan"

[[lean_lib]]
name = "Acharyya2024"

[[lean_lib]]
name = "Acharyya2025"

[[lean_lib]]
name = "DkpsQuench2026"

[[lean_lib]]
name = "Helm2025"

# Mathematics-first completion workspace for the sharp tan(2Theta) theory.
# `lake build FinishTanTwoTheta` follows the aggregate module's real proof
# closure.  Refuted or still-open research extensions remain individually
# buildable by module name, but are not glob-built as completed theorems.
[[lean_lib]]
name = "FinishTanTwoTheta"
srcDir = "FinishTanTwoTheta"


# Citation-priority completion lane for Yu--Wang--Samworth (2015).  The source
# is isolated organizationally but shares the root dependency graph and .lake.
[[lean_lib]]
name = "FinishYuWangSamworth"
srcDir = "FinishYuWangSamworth"
globs = ["FinishYuWangSamworth.*"]
# Measured against the option set Tau Ceti's own `lean_lib` applies, not this
# repository's default: `warningAsError` alone says nothing about whether an
# upstream PR would be accepted. Mirrors the `ForTauCeti` block above, including
# `style.header = false` (Tau Ceti disables the copyright-header linter).
leanOptions = { warningAsError = true, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, weak.linter.style.header = false }


# Comparator/challenge modules for community calibration of AI-authored
# upstream candidates. These are intentionally not default targets.
[[lean_lib]]
name = "Challenge"
globs = ["Challenge.*"]
