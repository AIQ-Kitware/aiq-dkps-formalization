name = "aiq_dkps_formalization"
version = "0.1.0"
keywords = ["math", "formalization", "DKPS", "MDS", "spectral-perturbation"]
# The ordinary build is the complete claimed-mathematics build.  Admission-
# dependent API experiments are available explicitly as DavisKahan.Experimental.
defaultTargets = ["ForMathlib", "DavisKahan.All", "Acharyya2024", "Acharyya2025", "DkpsQuench2026", "Helm2025"]

# Standalone Lean workspace for Davis--Kahan and four DKPS paper developments.
# The libraries share one Mathlib checkout/build and are intentionally kept as
# separate top-level Lean libraries so each paper-facing theorem layer can be
# built or imported independently.

[leanOptions]
pp.unicode.fun = true
# Avoid accidental free variables in theorem statements.
autoImplicit = false




# Mathlib-staging library: paper-agnostic results restated in Mathlib idiom,
# one file per proposed Mathlib destination path.  See ForMathlib/README.md.

# BEGIN vendored upstream Spectra snapshot
[[require]]
name = "Spectra"
path = "vendor/Spectra"
# END vendored upstream Spectra snapshot

# BEGIN authoritative root Mathlib dependency
# Keep this requirement last among all [[require]] blocks. Spectra currently
# pins an older Mathlib dependency graph; the root DKPS pins must win.
[[require]]
name = "mathlib"
scope = "leanprover-community"
# END authoritative root Mathlib dependency

[[lean_lib]]
name = "ForMathlib"

[[lean_lib]]
name = "DavisKahan"

[[lean_lib]]
name = "Acharyya2024"

[[lean_lib]]
name = "Acharyya2025"

[[lean_lib]]
name = "DkpsQuench2026"

[[lean_lib]]
name = "Helm2025"


# Comparator/challenge modules for community calibration of AI-authored
# ForMathlib candidates. These are intentionally not default targets.
[[lean_lib]]
name = "Challenge"
