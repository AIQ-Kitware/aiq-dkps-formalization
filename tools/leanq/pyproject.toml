[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leanq"
version = "0.1.0"
description = "Query a built Lean 4 library's declarations from the elaborator, not from regexes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Jon Crall" }]
keywords = ["lean4", "lean", "static-analysis", "sorry"]

# Deliberately dependency-free: the tool shells out to `lake` and emits JSON, so it drops into
# any environment without a resolve step.  Add dependencies here if a query needs them.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
leanq = "leanq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leanq"]

[tool.hatch.build.targets.wheel.force-include]
"src/leanq/lean/decl_index.lean" = "leanq/lean/decl_index.lean"
