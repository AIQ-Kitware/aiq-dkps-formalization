# formalization.yaml (v0.3): repo-root metadata for an AI-authored formalization project.
# Schema reference: https://github.com/mathlib-initiative/formalization.yaml
#
# Keep commit-sensitive status out of this file. Generated/checkable ledgers and
# repository gates own current counts and completion state.

version: "v0.3"

project:
  name: "AIQ DKPS formalization: reusable spectral, MDS, and geometry infrastructure"
  authors:
    - "Jon Crall"
  license: "Apache-2.0"
  repository: "https://github.com/AIQ-Kitware/aiq-dkps-formalization"
  validation_note: >
    Do not copy commit-specific proof counts or green-build claims into this file.
    Use the source censuses, comparator configs, and scripts/run_gates.py instead.

sources:
  - title: "Consistent Estimation of Generative Model Representations in the Data Kernel Perspective Space"
    authors: ["Acharyya", "Trosset", "Priebe", "Helm"]
    id: "Acharyya et al. 2024"
    type: "research paper"
    author_contacted: "yes; ongoing subject-matter discussion"
    prior_work: "Paper-facing theorem layer in Acharyya2024/; reusable mathematics in ForTauCeti/."
  - title: "Concentration Bounds on Response-Based Vector Embeddings of Black-Box Generative Models"
    authors: ["Acharyya", "Agterberg", "Park", "Priebe"]
    id: "Acharyya et al. 2025"
    type: "research paper"
    author_contacted: "yes; ongoing subject-matter discussion"
    prior_work: "Paper-facing theorem layer in Acharyya2025/; reusable mathematics in ForTauCeti/."
  - title: "Statistical Inference on Black-Box Generative Models in the Data Kernel Perspective Space"
    authors: ["Helm", "Acharyya", "Park", "Duderstadt", "Priebe"]
    id: "Helm et al. 2025"
    type: "research paper"
    author_contacted: "yes; ongoing subject-matter discussion"
    prior_work: "Paper-facing theorem layer in Helm2025/."
  - title: "Query-efficient model evaluation using cached responses"
    authors: ["Helm", "Johnson", "Priebe"]
    id: "Helm et al. 2026"
    type: "research paper"
    author_contacted: "yes; ongoing subject-matter discussion"
    prior_work: "Subject-oriented theorem library in DkpsQuench2026/."
  - title: "The rotation of eigenvectors by a perturbation. III"
    authors: ["Davis", "Kahan"]
    id: "Davis and Kahan 1970"
    type: "research paper"
    prior_work: "Source-facing formalization and maintained census in DavisKahan/Sources/DavisKahan1970/."
  - title: "A useful variant of the Davis-Kahan theorem for statisticians"
    authors: ["Yu", "Wang", "Samworth"]
    id: "Yu, Wang, and Samworth 2015"
    type: "research paper"
    prior_work: "Source-facing completion package and maintained census in FinishYuWangSamworth/."

