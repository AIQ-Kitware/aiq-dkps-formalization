status:
  repository_build:
    validation_commands:
      - "python3 scripts/check_davis_kahan_1970_statement_map.py"
      - "python3 scripts/check_davis_kahan_1970_source_census.py"
      - "python3 scripts/check_yu_wang_samworth_source_census.py"
      - "python3 scripts/run_gates.py --fast"
      - "lake build"
    comparator_configs:
      - "comparator/candidate-01-gram-rigidity.json"
      - "comparator/candidate-02-courant-fischer-weyl.json"
      - "comparator/candidate-03-davis-kahan.json"
      - "comparator/challenge-berge.json"
      - "comparator/challenge-cfc-measurable.json"
      - "comparator/challenge-davis-1963-rotation.json"
      - "comparator/challenge-davis-kahan-sylvester-pi-over-two.json"
      - "comparator/challenge-matrix-concentration.json"
      - "comparator/challenge-near-isometry.json"
      - "comparator/challenge-probability-qol.json"
      - "comparator/challenge-rank-factorization.json"
      - "comparator/challenge-rank-psd-realization.json"
      - "comparator/challenge-restrict-cover-measurable.json"
      - "comparator/challenge-sample-mean-mse.json"
      - "comparator/challenge-tendsto-in-measure.json"
      - "comparator/challenge-yu-wang-samworth.json"
  scope: >
    ForTauCeti is the reusable mathematics package and Tau Ceti is the current
    integration target. DavisKahan and the paper libraries provide source-facing
    theorem surfaces. ForMathlib and the maintained Spectra dependency are retired.
    Challenge/ retains comparator, regression, and exhibition surfaces. Neutral
    challenges live directly under Challenge/<Name>/; MathlibCandidate remains only
    as historical provenance for the original candidate surfaces.
  main_results:
    - declaration: "TauCeti.Matrix.gram_eq_gram_iff_exists_linearIsometryEquiv_map_eq"
      file: "ForTauCeti/Analysis/InnerProductSpace/Gram/Matrix.lean"
      challenge_file: "Challenge/MathlibCandidate/GramRigidity/Conformance.lean"
      solution_file: "Challenge/MathlibCandidate/GramRigidity/Leaderboard.lean"
      comparator_config: "comparator/candidate-01-gram-rigidity.json"
      category: "Gram-matrix rigidity"
    - declaration: "TauCeti.abs_eigenvalues_sub_le_opNorm"
      file: "ForTauCeti/Analysis/InnerProductSpace/CourantFischer.lean"
      challenge_file: "Challenge/MathlibCandidate/CourantFischerWeyl/Conformance.lean"
      solution_file: "Challenge/MathlibCandidate/CourantFischerWeyl/Leaderboard.lean"
      comparator_config: "comparator/candidate-02-courant-fischer-weyl.json"
      category: "Courant-Fischer min-max and Weyl perturbation"
    - declaration: "TauCeti.sum_norm_sub_starProjection_span_sq_le"
      file: "DavisKahan/Alternative/FiniteDimensional/EigenbasisFrobenius.lean"
      challenge_file: "Challenge/MathlibCandidate/DavisKahan/Conformance.lean"
      solution_file: "Challenge/MathlibCandidate/DavisKahan/Leaderboard.lean"
      comparator_config: "comparator/candidate-03-davis-kahan.json"
      category: "Davis-Kahan cross-block / sin-Theta"
  regression_challenges:
    note: >
      Neutral comparator/regression surfaces outside the historical candidate set.
    configs:
      - "comparator/challenge-berge.json"
      - "comparator/challenge-cfc-measurable.json"
      - "comparator/challenge-davis-1963-rotation.json"
      - "comparator/challenge-davis-kahan-sylvester-pi-over-two.json"
      - "comparator/challenge-matrix-concentration.json"
      - "comparator/challenge-near-isometry.json"
      - "comparator/challenge-probability-qol.json"
      - "comparator/challenge-rank-factorization.json"
      - "comparator/challenge-rank-psd-realization.json"
      - "comparator/challenge-restrict-cover-measurable.json"
      - "comparator/challenge-sample-mean-mse.json"
      - "comparator/challenge-tendsto-in-measure.json"
      - "comparator/challenge-yu-wang-samworth.json"

  source_exhibitions:
    - name: "Davis--Kahan 1970"
      challenge_file: "Challenge/DavisKahan1970/Conformance.lean"
      solution_file: "Challenge/DavisKahan1970/Leaderboard.lean"
      comparator_config: "comparator/davis-kahan-1970.json"
      expected_status: "red_until_exact_tan_two_theta_directed_is_proved"
      note: >
        The challenge intentionally includes the literal directed-residual and ambient Section 2 tan-2Theta
        endpoints without an added pole-exclusion or selected-block placement premise. The ambient endpoint is now
        source-faithfully compiled over both complex and real Hilbert spaces; keep the comparator red until the
        directed residual endpoint has the same exact source-facing coverage.

fidelity:
  summary: >
    Comparator challenges isolate reusable theorem statements and dependency checks;
    they do not certify fidelity of paper-specific definitions or source transcription.
    Paper fidelity is tracked by source-facing modules, correspondence records, maintained
    censuses, and for Davis--Kahan 1970 a distributable source-order TeX specification plus a
    machine-readable source-to-Lean statement map. Compiler certificates and semantic source
    review are intentionally separate evidence layers.
  known_limitations:
    - "Comparator success does not substitute for human review of paper-specific definitions and theorem transcription."
    - "Generated/checkable status artifacts should be preferred over prose snapshots when they disagree."
    - "A Davis--Kahan compilation certificate proves elaboration and declaration resolution, not that the compiled theorem types are semantically identical to the paper; independent row-by-row mathematical review remains required."
    - "Without the complete paper or private modernized transcription, an external auditor can certify fidelity of all registered Davis--Kahan claims but cannot independently prove that the claim register itself omitted no mathematical source claim."
    - "The current Davis--Kahan census intentionally keeps the two-conclusion Section 2 tan(2 Theta) row as a compiled specialization: the ambient complex/real wrappers are now exact, but the directed residual arbitrary-UI-norm conclusion still lacks a public source-facing wrapper deriving pole exclusion from only the printed hypotheses."

review:
  status: "self-assessed"
  reviewers:
    - "Jon Crall"
  notes: >
    The repository contains comparator, axiom, census, grounding, dependency-layer,
    and other mechanical checks. Independent mathematical and external-library review
    remain distinct from those checks. For Davis--Kahan 1970, run
    `python3 scripts/certify_davis_kahan_1970.py --clean` to generate a self-contained
    compiler-evidence bundle and one-row-at-a-time audit packet. A private transcription
    or lawful copy of the paper may be used separately to re-audit the fidelity of the
    checked-in TeX source specification; it is not an input to the certificate. Add
    `--require-terminal` only
    when requesting a certificate that also treats the maintained census as claiming
    terminal coverage; compiler certification and semantic fidelity remain separate.
    Current integration policy targets Tau Ceti.

alignment:
  statements:
    - informal: "Two vector families with equal pairwise inner products have isometrically equivalent generated spans."
      lean: "TauCeti.linearIsometryEquivSpanOfInnerEq"
      status: "proved in ForTauCeti"
    - informal: "Finite configurations with equal pairwise inner products are equivalent up to a linear isometry."
      lean: "TauCeti.exists_linearIsometryEquiv_map_eq_of_inner_eq"
      status: "proved in ForTauCeti"
    - informal: "Equal Gram matrices characterize equality up to linear isometry."
      lean: "TauCeti.Matrix.gram_eq_gram_iff_exists_linearIsometryEquiv_map_eq"
      status: "proved in ForTauCeti"
    - informal: "A PSD matrix of rank at most d is a Gram matrix of d-dimensional vectors."
      lean: "TauCeti.Matrix.posSemidef_and_rank_le_iff_exists_conjTranspose_mul_self"
      status: "proved in ForTauCeti"
    - informal: "Weyl eigenvalue perturbation for finite-dimensional self-adjoint operators."
      lean: "TauCeti.abs_eigenvalues_sub_le_opNorm"
      status: "proved in ForTauCeti"
    - informal: "Source-facing Davis-Kahan Part III sine-theta theorem for unitarily invariant norms."
      lean: "TauCeti.DavisKahanTheory.partIII_sinTheta_uiNorm"
      status: "production source surface"
    - informal: "Source-facing sharp operator-norm tan-two-theta theorem."
      lean: "TauCeti.DavisKahanTheory.partIII_tanTwoTheta_opNorm"
      status: "production source surface"

