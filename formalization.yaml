    ForTauCeti is the reusable mathematics package and Tau Ceti is the current
    integration target. DavisKahan and the paper libraries provide source-facing
    theorem surfaces. ForMathlib and the maintained Spectra dependency are retired.
    Challenge/ retains comparator and regression surfaces; its MathlibCandidate and
    MathlibPending directory names are historical and do not describe a live Mathlib
    submission queue.
  main_results:
    - declaration: "TauCeti.Matrix.gram_eq_gram_iff_exists_linearIsometryEquiv_map_eq"
      file: "ForTauCeti/Analysis/InnerProductSpace/Gram/Matrix.lean"
      challenge_file: "Challenge/MathlibCandidate/GramRigidity/Conformance.lean"
      solution_file: "Challenge/MathlibCandidate/GramRigidity/Leaderboard.lean"
      comparator_config: "comparator/candidate-01-gram-rigidity.json"
      category: "Gram-matrix rigidity"
    - declaration: "TauCeti.abs_eigenvalues_sub_le_opNorm"
      file: "ForTauCeti/Analysis/InnerProductSpace/CourantFischer.lean"
      challenge_file: "Challenge/MathlibCandidate/CourantFischerWeyl/Conformance.lean"
      solution_file: "Challenge/MathlibCandidate/CourantFischerWeyl/Leaderboard.lean"
      comparator_config: "comparator/candidate-02-courant-fischer-weyl.json"
      category: "Courant-Fischer min-max and Weyl perturbation"
    - declaration: "TauCeti.sum_norm_sub_starProjection_span_sq_le"
