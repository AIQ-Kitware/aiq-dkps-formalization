# formalization.yaml (v0.3): repo-root metadata for an AI-authored formalization project.
# Schema reference: https://github.com/mathlib-initiative/formalization.yaml
#
# Keep commit-sensitive status out of this file. Generated/checkable ledgers and
# repository gates own current counts and completion state.

version: "v0.3"

project:
  name: "AIQ DKPS formalization: reusable spectral, MDS, and geometry infrastructure"
  authors:
    - "Jon Crall"
  license: "Apache-2.0"
  repository: "https://github.com/AIQ-Kitware/aiq-dkps-formalization"
  validation_note: >
    Do not copy commit-specific proof counts or green-build claims into this file.
    Use the source censuses, comparator configs, and scripts/run_gates.py instead.
    The Davis--Kahan certificate command is intentionally a separate, expensive clean-
    build audit artifact rather than a normal fast gate.

