  source_exhibition_note: >
    This config intentionally contains unproved exact-paper tan-2Theta targets and is not part
    of the default green comparator runner.
  regression_configs:
    - "comparator/challenge-berge.json"
    - "comparator/challenge-cfc-measurable.json"
    - "comparator/challenge-davis-1963-rotation.json"
    - "comparator/challenge-davis-kahan-sylvester-pi-over-two.json"
    - "comparator/challenge-matrix-concentration.json"
    - "comparator/challenge-near-isometry.json"
    - "comparator/challenge-probability-qol.json"
    - "comparator/challenge-rank-factorization.json"
    - "comparator/challenge-rank-psd-realization.json"
    - "comparator/challenge-restrict-cover-measurable.json"
    - "comparator/challenge-sample-mean-mse.json"
    - "comparator/challenge-tendsto-in-measure.json"
    - "comparator/challenge-yu-wang-samworth.json"

automation:
  methods:
    - method: "agent"
      description: "AI-authored Lean formalization with human coordination and review"
      human_role: >
        The human coordinator directs scope, runs builds and audits, inspects theorem
        interfaces, coordinates subject-matter review, and decides repository policy.
      soundness_gate: >
        The Lean kernel is the proof checker. Repository gates additionally audit
        selected dependency, axiom, census, grounding, and comparator properties.
        Those mechanical checks do not replace mathematical or source-fidelity review.
