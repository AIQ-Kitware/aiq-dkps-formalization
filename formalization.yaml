      challenge_file: "Challenge/DavisKahan1970/Conformance.lean"
      solution_file: "Challenge/DavisKahan1970/Leaderboard.lean"
      comparator_config: "comparator/davis-kahan-1970.json"
      expected_status: "green_when_exact_tan_two_theta_directed_and_ambient_wrappers_compile"
      note: >
        The challenge includes the literal directed-residual and ambient Section 2 tan-2Theta endpoints
        without an added pole-exclusion or selected-block placement premise.  The source layer now exposes
        exact complex and real wrappers for both conclusions; keep the comparator green only while those
        wrappers compile at the printed scope rather than weakening the paper-faithful target.

fidelity:
  summary: >
    Comparator challenges isolate reusable theorem statements and dependency checks;
    they do not certify fidelity of paper-specific definitions or of the distributable
    source specification. Davis--Kahan 1970 tracks three independent evidence axes:
    source-facing implementation status, compiler verification, and hostile semantic
    completion certification. The checked-in DavisKahan1970_part_III.tex is the
    distributable source-order audit specification, while
    dev/davis-kahan-1970-source-atom-inventory.json is the fine-grained source-fidelity
    inventory; the separate dev/davis-kahan-1970-formalization-result-inventory.json
    is the 29-result completion denominator. The original paper remains the authority
    for re-auditing the reconstruction and result selection.
  known_limitations:
    - "Comparator success does not substitute for semantic review of paper-specific definitions and theorem statements."
    - "Generated/checkable status artifacts should be preferred over prose snapshots when they disagree."
    - "A Davis--Kahan compilation certificate proves elaboration and declaration resolution, not source equivalence; 100% additionally requires terminal exact/refuted evidence and semantic acceptance for every result in the formalization-result inventory."
    - "The 2026-08-12 hostile re-audit and 272-atom source inventory remain source-fidelity evidence. They are not the completion denominator. The hard 100% denominator is the 29 results Davis--Kahan actually establish; each requires exact source-facing Lean evidence and semantic review."
    - "One counted result, S2-tan-theta, has a printed statement that is not locally self-contained: the Section 2 ambient tan(Theta) conclusion does not state the crossed-defect condition (3.5), which the source introduces in Section 3, then assumes as standing, and relies on when proving the theorem in Section 6. The row is classified paper-faithful under an accepted, hash-pinned nonlocal source interpretation, NOT as refuted; the bilateral-shift construction is a vacuity/nonvacuity witness rather than a counterexample to it. The generated audit packet discloses the dependency and asks an independent reviewer to adjudicate it."
    - "Section 10, including Question 10.4, is open-question material and does not contribute completion obligations. Preceding identities remain source-fidelity material unless they are part of a separately designated proved result."
    - "The exact directed and ambient Section 2 tan(2 Theta) source wrappers are now compiled in real and complex scope; that historical gap is closed and should not be reintroduced."

review:
  status: "self-assessed"
  reviewers:
    - "Jon Crall"
  notes: >
    The repository contains comparator, axiom, census, grounding, dependency-layer,
    and other mechanical checks. Independent mathematical and external-library review
    remain distinct from those checks. For Davis--Kahan 1970, run
    `python3 scripts/certify_davis_kahan_1970.py --clean` to generate a self-contained
    compiler-evidence bundle and source-order audit packet. The 50 rows are organizational
    groups and the 272 atoms are an exhaustive source-fidelity/disclosure surface; neither is
    the formalization denominator. Every fidelity atom has an explicit boundary reason and
    reverse link to any counted result it supports, and all 29 counted results have accepted
    printed-statement boundary reviews. No private transcription is a certificate input. Add
    `--require-terminal` only when requesting the hard 100% gate: every one of the 29 results
    Davis--Kahan actually establish must have exact/refuted source-facing evidence,
    `proved_in_build` verification, hostile semantic certification `accepted`, and any required
    refutation repair. Section 10, deferred/unproved claims, proof details, examples, and
    historical material remain visible fidelity records but are not completion obligations.
    Current integration policy targets Tau Ceti.

alignment:
  statements:
    - informal: "Two vector families with equal pairwise inner products have isometrically equivalent generated spans."
      lean: "TauCeti.linearIsometryEquivSpanOfInnerEq"
      status: "proved in ForTauCeti"
    - informal: "Finite configurations with equal pairwise inner products are equivalent up to a linear isometry."
      lean: "TauCeti.exists_linearIsometryEquiv_map_eq_of_inner_eq"
      status: "proved in ForTauCeti"
    - informal: "Equal Gram matrices characterize equality up to linear isometry."
      lean: "TauCeti.Matrix.gram_eq_gram_iff_exists_linearIsometryEquiv_map_eq"
      status: "proved in ForTauCeti"
    - informal: "A PSD matrix of rank at most d is a Gram matrix of d-dimensional vectors."
      lean: "TauCeti.Matrix.posSemidef_and_rank_le_iff_exists_conjTranspose_mul_self"
      status: "proved in ForTauCeti"
    - informal: "Weyl eigenvalue perturbation for finite-dimensional self-adjoint operators."
      lean: "TauCeti.abs_eigenvalues_sub_le_opNorm"
      status: "proved in ForTauCeti"
    - informal: "Source-facing Davis-Kahan Part III sine-theta theorem for unitarily invariant norms."
      lean: "TauCeti.DavisKahanTheory.partIII_sinTheta_uiNorm"
      status: "production source surface"
    - informal: "Source-facing sharp operator-norm tan-two-theta theorem."
      lean: "TauCeti.DavisKahanTheory.partIII_tanTwoTheta_opNorm"
      status: "production source surface"

