# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
#
# formalization.yaml v0.4 — repository-root metadata for this formalization.
#
# This describes the whole substantive development. A Palomar entry is one
# Comparator config, not the whole repository; per-entry metadata, when it exists,
# lives beside that config. See dev/palomar-readiness.md.
#
# Keep commit-sensitive status out of this file. Generated and checkable ledgers
# own current counts and completion state: the source censuses under dev/, the
# comparator configs, and scripts/run_gates.py. Nothing here should have to be
# edited because a proof landed.
version: "v0.4"

project:
  name: "AIQ DKPS formalization: spectral perturbation theory and the data kernel perspective space"
  description: >-
    A Lean 4 formalization of spectral subspace perturbation theory and of its
    application to representations of generative models. The foundational layer
    formalizes Davis and Kahan's "The rotation of eigenvectors by a perturbation
    III" (1970) at its stated scope — a separable Hilbert space, unbounded
    self-adjoint operators as Mathlib `LinearPMap`s, and arbitrary unitarily
    invariant norms — together with the Yu–Wang–Samworth (2015) population-gap
    variant used throughout statistics. Reusable mathematics is packaged
    separately from paper-facing statements: `ForTauCeti/` holds the general
    theory, and each source paper has its own package of theorems stated at the
    printed scope. Four applied papers on the data kernel perspective space
    (Acharyya et al. 2024 and 2025, Helm et al. 2025, Helm–Johnson–Priebe 2026)
    are formalized on top of that foundation, with consistency, concentration,
    query-efficiency and risk-transfer results. Every source paper carries a
    maintained census that records, result by result, whether the Lean theorem is
    the printed one, a documented repair of a printed statement that does not
    stand, or a refutation with a machine-checked counterexample.
  authors:
    - "Jon Crall"
    - "Edward Wang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jon Crall"

# `repository` is omitted deliberately: this repository is the substantive proof
# development, not a thin Comparator wrapper. A wrapper repository extracted from
# it for submission carries its own metadata declaring
# `repository.substantive_formalization` pinned at a commit of this repository.

classification:
  arxiv: ["math.FA", "math.ST"]
  msc2020:
    - "47A55"   # Perturbation theory of linear operators
    - "47A15"   # Invariant subspaces of linear operators
    - "15A42"   # Inequalities involving eigenvalues and singular values
    - "65F15"   # Numerical computation of eigenvalues and eigenvectors
    - "62H25"   # Factor analysis, principal components, correspondence analysis

sources:
  - title: "The rotation of eigenvectors by a perturbation. III"
    authors: ["Chandler Davis", "William M. Kahan"]
    id: "doi:10.1137/0707001"
    type: "paper"
    location: "SIAM Journal on Numerical Analysis 7(1), 1970, 1–46"
    relationship: "formalizes"
    note: >-
      Formalized at the printed scope, result by result, against a checked-in
      source-order specification. One printed result does not stand: Proposition
      4.4 is refuted by a machine-checked counterexample satisfying its printed
      hypotheses, and the natural Q-norm repair is proved separately. See
      `fidelity.divergences`.
    author_endorsement: "not-contacted"

  - title: "A useful variant of the Davis–Kahan theorem for statisticians"
    authors: ["Yi Yu", "Tengyao Wang", "Richard J. Samworth"]
    id: "doi:10.1093/biomet/asv008"
    type: "paper"
    location: "Biometrika 102(2), 2015, 315–323"
    relationship: "formalizes"
    note: >-
      Theorem 2's two conclusions are formalized as printed. Four printed
      defects do not stand as written and are recorded rather than absorbed:
      Equation (4) omits a square; Theorem 3's rank-boundary convention
      `sigma^2_{rank(A)+1} := -infinity` is false; the standalone Corollary 1
      omits the unit normalization its own `d = 1` reading supplies, without
      which its second display is false; and Theorem 1's sample endpoint
      conventions are inverted, which makes it vacuous at any block touching an
      end of the spectrum. All are in the census and in `fidelity.divergences`.
    author_endorsement: "not-contacted"

  - title: >-
      Consistent estimation of generative model representations in the data
      kernel perspective space
    authors: ["Aranyak Acharyya", "Michael W. Trosset", "Carey E. Priebe", "Hayden S. Helm"]
    id: "arXiv:2409.17308"
    type: "paper"
    relationship: "adapts"
    note: >-
      Theorems 2 and 4 are formalized as printed, from the paper's own replicate
      and trace-covariance assumptions. Theorem 5 and Lemma 2 required a repair to
      the sampling model, stated explicitly rather than absorbed: see
      `fidelity.divergences`. The authors were contacted and subject-matter
      discussion is ongoing; no endorsement of this formalization has been sought
      or given.
    author_endorsement: "other"

  - title: >-
      Concentration bounds on response-based vector embeddings of black-box
      generative models
    authors: ["Aranyak Acharyya", "Joshua Agterberg", "Youngser Park", "Carey E. Priebe"]
    type: "paper"
    relationship: "adapts"
    note: >-
      The printed finite concentration bound omits an entrywise dissimilarity
      bound that its proof uses, and the printed manifold condition of Proposition
      1 does not by itself force the nondegeneracy the argument needs. Both are
      recorded as repairs. Authors contacted; discussion ongoing; no endorsement
      sought or given.
    author_endorsement: "other"

  - title: >-
      Statistical inference on black-box generative models in the data kernel
      perspective space
    authors:
      - "Hayden S. Helm"
      - "Aranyak Acharyya"
      - "Youngser Park"
      - "Brandon Duderstadt"
      - "Carey E. Priebe"
    type: "paper"
    relationship: "adapts"
    note: >-
      The risk-transfer argument needs a uniform-integrability / dominated-loss
      hypothesis that the printed statement omits; convergence in probability alone
      does not give convergence of expected risk, and the repository carries the
      evidence for that necessity. Authors contacted; discussion ongoing; no
      endorsement sought or given.
    author_endorsement: "other"

  - title: "Query-efficient model evaluation using cached responses"
    authors: ["Hayden S. Helm", "Brandon Johnson", "Carey E. Priebe"]
    type: "paper"
    relationship: "adapts"
    note: >-
      The nearest-neighbour estimator is formalized in a tie-averaged form, and a
      printed assumption quantified over all compact subsets does not stand as
      written and is corrected. Authors contacted; discussion ongoing; no
      endorsement sought or given.
    author_endorsement: "other"

related_formalizations:
  - id: "https://github.com/YuanheZ/lean-stat-learning-theory"
    relationship: "independent"
    note: >-
      Independent Lean development of statistical learning theory including
      Eckart–Young–Mirsky and singular-system material. Excerpts are retained under
      `vendor/lean/` with provenance for comparison only; nothing in this build
      imports them.
  - id: "https://github.com/jbarrcfl/mathlib4"
    relationship: "independent"
    note: >-
      Independent Mathlib branch carrying top-singular-value material. Excerpt
      retained under `vendor/lean/` for comparison only.
  - id: "https://github.com/Dronmong/drifting-identifiability"
    relationship: "independent"
    note: >-
      Independent Lean development with a finite frame bound. Excerpt retained
      under `vendor/lean/` for comparison only.

status:
  scope: >-
    Formalized: the Davis–Kahan 1970 result surface at its printed scope, with a
    maintained result inventory and source-order census; the Yu–Wang–Samworth 2015
    result surface; and the four DKPS application papers above, each with its own
    census and clause-by-clause semantic review. Reusable general mathematics is
    factored into `ForTauCeti/`, whose declarations already carry the namespaces
    they would have upstream.

    Not formalized, and not claimed: the numerical experiments in any of these
    papers; open questions, which are preserved as source material and are not
    proof obligations; and the informal exposition surrounding the counted results.
    A green build certifies compilation and declaration resolution, never source
    fidelity — that is what the censuses and semantic reviews are for, and they
    record disagreements with the printed papers rather than hiding them.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5"
        - "claude-opus-4-8"
        - "claude-fable-5"
        - "gpt-5.6-terra"
        - "gpt-5.6-sol"
      framework: "Claude Code"
      tool_setup: >-
        Agents worked directly in the repository with the Lean toolchain, running
        `lake build` and the repository's own gate suite. Model attribution is
        recorded per commit in Co-Authored-By trailers and per declaration in
        module provenance headers, and measured token usage is accounted in the
        checked-in ledger under `.llm_resource_tally/`.
      cost:
        wall_time: >-
          not tracked as elapsed time; the ledger records 44657 assistant turns
          across 1591 accounted commits
        spend_usd: "subscription-based; not tracked per commit"
        hardware: "API-only"
      prompting_notes: >-
        Work was directed by task, not by prompt template: a scope decision from
        the maintainer, then autonomous proof and audit work against the source
        censuses. Adversarial review prompts are checked in under `dev/` and are
        part of the audit record.
    - method: "manual"
      framework: "n/a"
      tool_setup: >-
        The human maintainer set scope and priorities, ran builds and audits,
        inspected theorem interfaces, coordinated subject-matter discussion with
        the applied-paper authors, adjudicated source-fidelity questions, accepted
        or rejected proposed repairs, and decided repository policy.
  spend_usd: "subscription-based; not tracked"
  notes: >-
    This is a heavily agent-authored formalization with human direction and
    review. The Lean kernel is the proof checker; the repository's mechanical
    gates additionally audit dependency layering, axiom closure, census
    consistency and comparator statement equality. Those checks do not establish
    that a Lean statement says what a paper says, which is why every source paper
    carries a separate clause-by-clause semantic review.

fidelity:
  divergences: >-
    Divergences from the printed sources are recorded per result in the censuses
    under `dev/` and are summarized here.

    Davis–Kahan 1970. Proposition 4.4 as printed is false; a machine-checked
    counterexample satisfies its printed hypotheses, and the natural Q-norm repair
    is proved separately as `directRotation_fullDisplacement_qnorm`. The Section 2
    ambient tan-Theta theorem is not locally self-contained: its printed statement
    does not carry the crossed-defect condition (3.5), which the source introduces
    in Section 3, treats as standing, and uses when proving the theorem in Section
    6. That row is accepted under an explicit nonlocal source reading, recorded and
    hash-pinned rather than silently assumed, and it is not classified as refuted.

    Yu–Wang–Samworth 2015. Printed Equation (4) does not stand as written and is
    corrected. The rank-boundary convention required a correction. The main
    population-gap theorem is formalized as printed.

    Acharyya et al. 2024. Theorems 2 and 4 are formalized as printed, with the
    Appendix A.2 second-moment passage discharged rather than assumed and with no
    rate shared across the model collection. Theorem 5 and Lemma 2 need a repair to
    the sampling model: the paper draws latent vectors iid while the estimator
    inside the displayed integral depends on model-specific response laws and on
    sampled responses, so the display does not denote anything under a measure
    carrying only the latent vector. The formalization augments the population
    measure by the response outcome. That is one repair among possible ones and is
    not claimed to be uniquely minimal; the alternative not taken is recorded in the
    census.

    Acharyya et al. 2025. The printed finite concentration bound omits an entrywise
    dissimilarity bound its proof uses. Proposition 1's printed compact-manifold
    condition does not by itself force the nondegeneracy the argument needs.

    Helm et al. 2025. The risk-transfer step needs a uniform-integrability /
    dominated-loss hypothesis absent from the printed statement.

    Helm–Johnson–Priebe 2026. The nearest-neighbour estimator is tie-averaged, and a
    printed assumption quantified over all compact subsets does not stand as written
    and is corrected.

review:
  status: "self-assessed"
  reviewers:
    - "Jon Crall"
  notes: >-
    No external peer review. What has happened, and should be read as exactly
    that: kernel verification of every claimed declaration by `lake build`;
    repository gates auditing dependency layers, axiom closure, docstring
    coverage, comparator statement equality and census consistency; repeated
    adversarial source audits in which an independent agent was asked to find
    a discrepancy between a printed statement and its Lean rendering, several of
    which found real defects that are recorded in the censuses; and human
    coordinator review of scope, theorem interfaces and repair decisions.

    For Davis–Kahan 1970, `python3 scripts/certify_davis_kahan_1970.py --clean`
    generates a self-contained compiler-evidence bundle and source-order audit
    packet. That certificate proves elaboration and declaration resolution. It
    does not prove source equivalence, and the completion standard is deliberately
    three independent axes: source-facing implementation, compiler verification,
    and hostile semantic acceptance.

alignment:
  namespace: "TauCeti"
  statements:
    - source: "Davis–Kahan 1970, Section 2, sin-Theta theorem"
      lean: "TauCeti.DavisKahanTheory.partIII_sinTheta_uiNorm"
      module: "DavisKahan.Sources.DavisKahan1970"
      status: "proved"
      note: >-
        The domain-aware unbounded self-adjoint statement for an arbitrary
        unitarily invariant norm, which is the canonical source-facing target;
        bounded and finite-dimensional forms are specializations of it.
    - source: "Davis–Kahan 1970, Section 2, tan-2Theta theorem"
      lean: "TauCeti.DavisKahanTheory.partIII_tanTwoTheta_opNorm"
      module: "DavisKahan.Sources.DavisKahan1970"
      status: "proved"
      note: "Sharp operator-norm form, at the printed scope."
    - source: "Davis–Kahan 1970, operator-norm sin-Theta, finite/bounded form"
      lean: "TauCeti.norm_starProjection_comp_starProjection_le"
      module: "ForTauCeti.Analysis.InnerProductSpace.SinTheta.OperatorNorm"
      status: "proved"
      note: >-
        Stated entirely in Mathlib vocabulary — symmetric operators, invariant
        subspaces, orthogonal projections, a quadratic-form separation and a
        perturbation bound — with the proof in the reusable layer.
    - source: "Yu–Wang–Samworth 2015, Theorem 2"
      lean: "YuWangSamworth2015.sqrt_sum_cross_le_of_population_gap"
      module: "YuWangSamworth2015.Core.Residual"
      status: "proved"
      note: >-
        The Frobenius sin-Theta bound that depends only on the population
        eigengap, which is the variant the paper exists to provide.
    - source: "Acharyya et al. 2024, Theorem 5"
      lean: "Acharyya2024.Consistency.lp_consistency_of_replicates_population"
      module: "Acharyya2024.Consistency"
      status: "adapted"
      note: >-
        Over the population law, from the paper's replicate and trace-covariance
        assumptions, under the sampling-model repair recorded in
        `fidelity.divergences`.
    - source: "Weyl eigenvalue perturbation (background)"
      lean: "TauCeti.abs_eigenvalues_sub_le_opNorm"
      module: "ForTauCeti.Analysis.InnerProductSpace.CourantFischer"
      status: "proved"
      note: "Supporting classical result, proved in the reusable layer."
    - source: "Gram-matrix rigidity (background)"
      lean: "TauCeti.Matrix.gram_eq_gram_iff_exists_linearIsometryEquiv_map_eq"
      module: "ForTauCeti.Analysis.InnerProductSpace.Gram.Matrix"
      status: "proved"
      note: >-
        Equal Gram matrices characterize equality up to a linear isometry; the
        identifiability fact underneath the multidimensional-scaling layer.

acknowledgements: >-
  Built on Mathlib. Tau Ceti is the upstream integration target for the reusable
  layer in `ForTauCeti/`, and is a pinned dependency of this build. The applied
  papers formalized here are the work of their authors, who are credited under
  `sources`; discussion with several of them informed the source-fidelity
  decisions recorded in the censuses. Independent Lean developments consulted for
  comparison are listed under `related_formalizations`.
