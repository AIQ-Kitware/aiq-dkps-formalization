# Production narration and /audio reader default. Override with
# DKVIS_TTS_PROFILE, or DKVIS_AUDIO_TTS_PROFILE for the reader only.
profile = "crall-math-dk-v2-breeze-tts2"

[defaults]
timeout_seconds = 600
# Short, sentence-aware requests avoid the observed 60-second Breeze cutoff.
max_chars = 420
max_words = 65
max_audio_seconds = 60.0
# Reject obviously incomplete passages, including stale cached responses.
# Applies to passages of at least 20 words; zero disables this sanity check.
max_speech_words_per_second = 12.0
chunk_pause_seconds = 0.12

[postprocess]
enabled = true
target_lufs = -18.0
peak_db = -1.5
loudness_range = 7.0
max_gain_db = 24.0
highpass_hz = 60.0
compression = true
threshold_db = -20.0
ratio = 2.5
attack_ms = 5.0
release_ms = 180.0
edge_fade_ms = 8.0

[profiles.crall-math-dk-v2-breeze-tts2]
# Output identity includes the reference speaker and the actual generation model.
narrator_voice = "crall-math-dk-v2"
endpoint_env = "CRALL_TTS_ENDPOINT"
endpoint = "http://127.0.0.1:8821/v1/audio/speech"
model = "breeze-tts2"
voice = "crall-math-dk-v2"
response_format = "wav"
record_server_runtime = true
# Longer passages reduce independent starts. Keep the server cutoff guard:
# slow or capped responses are still retried in smaller pieces.
max_chars = 750
max_words = 110

[profiles.crall-math-dk-v2-breeze-tts2.request]
instruction = "Speak in a warm, engaging lecture style with clear articulation. Maintain steady conversational loudness and restrained emphasis, including at the beginning of each passage."
cfg_scale = 2.0

[profiles.crall-math-dk-v2-breeze-tts2.reference]
source = "local-ai/services/tts/voice-references"
audio = "crall-math-dk-v2.wav"
transcript = "crall-math-dk-v2.txt"

# Legacy profile: retains the original reference voice and cache namespace.
[profiles.crall]
# Output identity includes the reference speaker and the actual generation model.
narrator_voice = "crall-math-dk"
endpoint_env = "CRALL_TTS_ENDPOINT"
endpoint = "http://127.0.0.1:8821/v1/audio/speech"
model = "breeze-tts2"
voice = "crall-math-dk"
response_format = "wav"
# Longer passages reduce independent starts. Keep the server cutoff guard:
# slow or capped responses are still retried in smaller pieces.
max_chars = 750
max_words = 110

[profiles.crall.request]
instruction = "Speak in a warm, engaging lecture style with clear articulation. Maintain steady conversational loudness and restrained emphasis, including at the beginning of each passage."
cfg_scale = 2.0

[profiles.breeze]
narrator_voice = "ryan"
endpoint_env = "BREEZE_TTS_ENDPOINT"
endpoint = "http://127.0.0.1:8812/v1/audio/speech"
model = "breeze-tts2"
voice = "ryan"
response_format = "wav"
# Match the reference-voice Breeze profiles: prefer coherent passages, while
# the duration-cap guard retries shorter requests if the server cuts one off.
max_chars = 750
max_words = 110

[profiles.kokoro]
display_name = "Kokoro"
narrator_voice = "af_alloy"
# Private host address belongs only in .env.
endpoint_env = "KOKORO_TTS_ENDPOINT"
endpoint = "http://127.0.0.1:8880/v1/audio/speech"
model = "kokoro"
voice = "af_alloy"
response_format = "mp3"

[profiles.qwen]
narrator_voice = "ryan"
endpoint_env = "QWEN_TTS_ENDPOINT"
endpoint = "http://127.0.0.1:11437/v1/audio/speech"
model = "qwen-1.7-customvoice-q8-ggml"
voice = "ryan"
response_format = "mp3"

[profiles.qwen.request]
language = "English"
stream = false

# Add another [profiles.NAME] to configure another server. A [profiles.NAME.request]
# table can pass model-specific fields such as speed or temperature.

# PLS spelling aliases reported to improve Breeze pronunciation for some voices.
# A local TTS_SETTINGS pronunciation_lexicon can select a speaker-specific file.
# An explicit pronunciation_replacements map overrides the lexicon; {} disables it.
[pronunciation_lexicons]
breeze-tts2 = "pronunciations/breeze-tested-en-us.pls"
