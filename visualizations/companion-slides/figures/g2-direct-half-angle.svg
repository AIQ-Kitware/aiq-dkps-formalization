<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="Direct rotation and doubled angle from two reflections"><rect x="0" y="0" width="560" height="270" rx="9" fill="#102131"/><defs><marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#9bdcf2" stroke-width="1.8"/></marker><marker id="g" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#f2c78d" stroke-width="1.8"/></marker></defs><text x="280" y="28" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" fill="#e5ecf0">THE HALF-ANGLE OF TWO REFLECTIONS</text><line x1="70" y1="181" x2="320" y2="181" stroke="#9bdcf2" stroke-width="3" stroke-linecap="round"/><line x1="180" y1="181" x2="332" y2="83" stroke="#f2c78d" stroke-width="3" stroke-linecap="round"/><line x1="180" y1="181" x2="310" y2="124" stroke="#ed9999" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><line x1="180" y1="181" x2="293" y2="174" stroke="#9bdcf2" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/><path d="M231.2,149.6 A60,60 0 0 1 240.0,181.0" stroke="#f2c78d" stroke-width="3" fill="none"/><path d="M257.6,133.4 A91,91 0 0 1 271.0,181.0" stroke="#ed9999" stroke-width="3" fill="none"/><text x="256" y="147" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#f2c78d">θ</text><text x="275" y="92" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#ed9999">2θ</text><text x="345" y="70" text-anchor="bold" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#f2c78d">W : θ</text><text x="345" y="106" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#ed9999">JᵥJᵤ : 2θ</text><text x="345" y="152" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#e5ecf0">W² = JᵥJᵤ</text><text x="285" y="252" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" fill="#e5ecf0">positive cosine selects the smaller rotation</text><desc>The direct rotation W acts through the acute principal angle theta, while composing reflections through the two subspaces rotates through twice theta.</desc></svg>