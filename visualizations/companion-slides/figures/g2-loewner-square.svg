<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="SQUARING IS NOT LOEWNER MONOTONE"><rect width="560" height="270" rx="9" fill="#102131"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#9bdcf2" stroke-width="1.8"/></marker></defs><text x="280" y="29" fill="#edf4f7" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="bold">SQUARING IS NOT LOEWNER MONOTONE</text><rect x="52" y="83" width="206" height="120" rx="5" fill="#1b3547" stroke="#426577" stroke-width="1.4"/><rect x="299" y="83" width="206" height="120" rx="5" fill="#1b3547" stroke="#426577" stroke-width="1.4"/><text x="155" y="118" fill="#9bdcf2" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" text-anchor="middle">K − H</text><text x="155" y="156" fill="#edf4f7" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" text-anchor="middle">[[1,1],[1,1]]</text><text x="155" y="186" fill="#87cbb2" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" text-anchor="middle">positive</text><text x="403" y="118" fill="#f2c78d" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" text-anchor="middle">K² − H²</text><text x="403" y="156" fill="#edf4f7" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" text-anchor="middle">[[4,3],[3,2]]</text><text x="403" y="186" fill="#f2c78d" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" text-anchor="middle">det = −1</text><text x="280" y="260" fill="#aec2ce" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" text-anchor="middle">Positivity of K−H cannot be carried through matrix squaring</text><desc>H&lt;=K and H,K positive, but K squared minus H squared is indefinite.</desc></svg>