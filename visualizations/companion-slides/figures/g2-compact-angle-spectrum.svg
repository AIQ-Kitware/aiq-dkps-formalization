 fill="#28607a" stroke="#9bdcf2" stroke-width="1.5"/><text x="373" y="242" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="normal" fill="#9ab0be">5</text><rect x="419" y="205.4" width="32" height="12.6" rx="3" fill="#28607a" stroke="#9bdcf2" stroke-width="1.5"/><text x="435" y="242" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="normal" fill="#9ab0be">6</text><text x="52" y="76" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#9bdcf2">λ</text><text x="48" y="219" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#9ab0be">0</text><text x="282" y="265" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#e5ecf0">λₙ &gt; 0 but λₙ → 0; zero need not be an eigenvalue</text><desc>Nonzero eigenvalues of compact positive cosine-square operator have finite multiplicity and can accumulate at zero without an exact right-angle eigenvector.</desc></svg>