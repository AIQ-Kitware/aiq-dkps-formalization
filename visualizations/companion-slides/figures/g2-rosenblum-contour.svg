<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" role="img" aria-label="A complex-plane contour encloses sigma A and excludes sigma B"><title>g2 rosenblum contour</title><desc>A complex-plane contour encloses sigma A and excludes sigma B. New diagram authored specifically for the G2 Sylvester lecture companion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#9fdef3"/></marker></defs><text x="36" y="46" font-size="23" text-anchor="start" font-weight="bold" fill="#f0f3ec" font-family="DejaVu Sans, sans-serif">Resolvent contour separates two spectra</text><line x1="73" y1="166" x2="643" y2="166" stroke="#a9c0cc" stroke-width="1" stroke-linecap="round"/><line x1="355" y1="80" x2="355" y2="303" stroke="#a9c0cc" stroke-width="1" stroke-linecap="round"/><path d="M170 167 C159 101 253 66 315 96 C362 125 356 221 303 239 C242 267 170 231 170 167" fill="none" stroke="#9fdef3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="232" cy="165" r="10" fill="#efc58c"/><text x="231" y="191" font-size="20" text-anchor="middle" font-weight="normal" fill="#efc58c" font-family="DejaVu Sans, sans-serif">σ(A)</text><circle cx="484" cy="166" r="10" fill="#83ceb8"/><text x="499" y="197" font-size="20" text-anchor="start" font-weight="normal" fill="#83ceb8" font-family="DejaVu Sans, sans-serif">σ(B)</text><text x="266" y="90" font-size="25" text-anchor="start" font-weight="normal" fill="#9fdef3" font-family="DejaVu Sans, sans-serif">Γ</text><text x="456" y="289" font-size="18" text-anchor="middle" font-weight="normal" fill="#a9c0cc" font-family="DejaVu Sans, sans-serif">B outside Γ</text></svg>