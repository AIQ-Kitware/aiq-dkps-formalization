ke="#9ab2c0" stroke-width="1.4"/><text x="316" y="164" fill="#9ab2c0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="start">H00</text><text x="316" y="188" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">P=0, Q=0</text><rect x="122" y="221" width="316" height="38" rx="8" fill="#524333" stroke="#f1bf76" stroke-width="1.4"/><text x="280" y="247" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">generic G: paired angles 0 &lt; θ &lt; 90°</text><desc>The pair of projections acts as fixed binary values on the four elementary intersection spaces, and the remaining generic space contains nontrivial principal angle blocks.</desc></svg>