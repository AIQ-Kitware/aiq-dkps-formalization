<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="Projection-defined intertwiner between two orthogonal decompositions"><rect x="0" y="0" width="560" height="270" rx="9" fill="#102131"/><defs><marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#9bdcf2" stroke-width="1.8"/></marker><marker id="g" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#f2c78d" stroke-width="1.8"/></marker></defs><text x="280" y="27" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="bold" fill="#e5ecf0">INTERTWINING BY COMPLEMENTARY PROJECTIONS</text><rect x="35" y="54" width="188" height="160" rx="8" fill="#193448" stroke="#3c6175" stroke-width="1.5"/><rect x="338" y="54" width="188" height="160" rx="8" fill="#193448" stroke="#3c6175" stroke-width="1.5"/><rect x="52" y="74" width="154" height="49" rx="8" fill="#21465a" stroke="#9bdcf2" stroke-width="1.5"/><rect x="355" y="74" width="154" height="49" rx="8" fill="#21465a" stroke="#9bdcf2" stroke-width="1.5"/><text x="129" y="105" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" fill="#9bdcf2">U</text><text x="430" y="105" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" fill="#9bdcf2">V</text><line x1="207" y1="99" x2="350" y2="99" stroke="#9bdcf2" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><rect x="52" y="148" width="154" height="49" rx="8" fill="#21465a" stroke="#f2c78d" stroke-width="1.5"/><rect x="355" y="148" width="154" height="49" rx="8" fill="#21465a" stroke="#f2c78d" stroke-width="1.5"/><text x="129" y="179" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" fill="#f2c78d">U⊥</text><text x="430" y="179" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" fill="#f2c78d">V⊥</text><line x1="207" y1="173" x2="350" y2="173" stroke="#f2c78d" stroke-width="3" stroke-linecap="round" marker-end="url(#g)"/><text x="280" y="87" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" fill="#9bdcf2">QP</text><text x="280" y="163" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#f2c78d">(I−Q)(I−P)</text><text x="280" y="251" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#e5ecf0">K = QP + (I−Q)(I−P)</text><desc>K sends U toward V with QP and U-perpendicular toward V-perpendicular with the complementary projection product.</desc></svg>