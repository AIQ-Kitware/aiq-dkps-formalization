<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="A tilted source vector splits into target overlap and perpendicular escape"><rect width="560" height="270" rx="8" fill="#102231"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#9cd6ef" stroke-width="1.5"/></marker><marker id="goldarrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#f1bf76" stroke-width="1.5"/></marker></defs><line x1="86" y1="215" x2="483" y2="215" stroke="#9cd6ef" stroke-width="4" stroke-linecap="round"/><line x1="109" y1="245" x2="109" y2="28" stroke="#9ab2c0" stroke-width="1" stroke-linecap="round"/><line x1="109" y1="215" x2="394" y2="70" stroke="#f1bf76" stroke-width="4" stroke-linecap="round"/><line x1="109" y1="215" x2="390" y2="215" stroke="#9ab2c0" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 5"/><line x1="394" y1="70" x2="351" y2="154" stroke="#f18f92" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="351" cy="154" r="4" fill="#f18f92" stroke="#f18f92" stroke-width="1"/><text x="430" y="61" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">U</text><text x="444" y="234" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">V</text><text x="369" y="131" fill="#f18f92" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">(I−Q)e</text><text x="242" y="188" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Qe</text><path d="M174 215 A65 65 0 0 0 166 183" fill="none" stroke="#f1bf76" stroke-width="2.5"/><text x="186" y="181" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start">θ</text><text x="280" y="260" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="middle">e = Qe + (I−Q)e</text><desc>A source vector e in U splits orthogonally into its projection Qe onto V and its perpendicular remainder (I-Q)e.</desc></svg>