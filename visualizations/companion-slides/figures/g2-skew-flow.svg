ns,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">velocity ⟂ x</text><text x="447" y="161" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">||x(t)|| fixed</text><text x="280" y="257" fill="#9ab2c0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">The flow stays on a sphere</text><desc>For K skew-adjoint, the derivative vector Kx is orthogonal to x in the real part of the inner product and e^{tK} preserves norm.</desc></svg>