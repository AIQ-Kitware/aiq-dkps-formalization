t-weight="normal" fill="#f2c78d">σ₃</text><text x="480" y="93" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#f2c78d">delete j−1</text><text x="480" y="117" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#f2c78d">largest</text><text x="480" y="172" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#9bdcf2">retain j</text><text x="480" y="196" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#9bdcf2">strongest</text><text x="280" y="265" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#e5ecf0">σⱼ: smallest worst residual  =  largest guaranteed minimum</text><desc>Singular vectors have different output stretch values; min-max singular value principles optimize over the subspaces discarded or retained.</desc></svg>