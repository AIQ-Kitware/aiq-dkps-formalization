<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" role="img" aria-label="Exponential decay in the ordered spectral gap integral"><title>g2 decay flow</title><desc>Exponential decay in the ordered spectral gap integral. New diagram authored specifically for the G2 Sylvester lecture companion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#9fdef3"/></marker></defs><text x="38" y="45" font-size="23" text-anchor="start" font-weight="bold" fill="#f0f3ec" font-family="DejaVu Sans, sans-serif">Ordered gap gives a decaying integrand</text><line x1="85" y1="274" x2="638" y2="274" stroke="#a9c0cc" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="85" y1="274" x2="85" y2="95" stroke="#a9c0cc" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M85 109 C135 154 203 208 275 237 C390 267 477 269 626 271" fill="none" stroke="#9fdef3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="98" font-size="18" text-anchor="start" font-weight="normal" fill="#9fdef3" font-family="DejaVu Sans, sans-serif">1</text><text x="631" y="295" font-size="20" text-anchor="start" font-weight="normal" fill="#a9c0cc" font-family="DejaVu Sans, sans-serif">t</text><text x="180" y="140" font-size="22" text-anchor="start" font-weight="normal" fill="#9fdef3" font-family="DejaVu Sans, sans-serif">e^(−δt)</text><text x="401" y="86" font-size="23" text-anchor="middle" font-weight="normal" fill="#efc58c" font-family="DejaVu Sans, sans-serif">integral = 1/δ</text></svg>