<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
<title id="title">Squared displacement singular values</title>
<desc id="desc">The canonical direct rotation has four equal positive squared displacement singular values 2 minus square root of 2. A competitor has squared singular values 2, 2, 0, 0. Both are sorted decreasing; cumulative sums of the direct list stay below those of the competitor.</desc>
<rect width="720" height="400" rx="10" fill="#132838"/>
<g font-family="sans-serif" fill="#eef4f8"><text x="32" y="47" font-size="23">Sorted squared displacement values</text>
<text x="32" y="106" font-size="18" fill="#91d7e7">Direct rotation</text>
<text x="32" y="258" font-size="18" fill="#f0c48b">Competitor</text></g>
<g fill="#264354" stroke="#7693a5" stroke-width="1"><path d="M32 207 H690 M32 360 H690" fill="none"/></g>
<g fill="#7fd3e4"><rect x="190" y="170" width="86" height="37" rx="3"/><rect x="292" y="170" width="86" height="37" rx="3"/><rect x="394" y="170" width="86" height="37" rx="3"/><rect x="496" y="170" width="86" height="37" rx="3"/></g>
<g fill="#eebd79"><rect x="190" y="274" width="86" height="86" rx="3"/><rect x="292" y="274" width="86" height="86" rx="3"/></g>
<g fill="#c3d9e2" font-family="sans-serif" font-size="15" text-anchor="middle"><text x="233" y="225">1</text><text x="335" y="225">2</text><text x="437" y="225">3</text><text x="539" y="225">4</text><text x="233" y="378">1</text><text x="335" y="378">2</text><text x="437" y="378">3</text><text x="539" y="378">4</text>
<text x="233" y="161">2−√2</text><text x="335" y="161">2−√2</text><text x="437" y="161">2−√2</text><text x="539" y="161">2−√2</text>
<text x="233" y="264">2</text><text x="335" y="264">2</text><text x="437" y="345">0</text><text x="539" y="345">0</text></g>
<text x="32" y="395" fill="#bdceda" font-family="sans-serif" font-size="13">Bar height is schematic; ordering and exact values are labeled.</text>
</svg>