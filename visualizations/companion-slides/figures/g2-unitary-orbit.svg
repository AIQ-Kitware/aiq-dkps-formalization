<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" role="img" aria-label="Unit-modulus Fourier orbit versus decaying semigroup"><title>g2 unitary orbit</title><desc>Unit-modulus Fourier orbit versus decaying semigroup. New diagram authored specifically for the G2 Sylvester lecture companion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#9fdef3"/></marker></defs><text x="45" y="45" font-size="23" text-anchor="start" font-weight="bold" fill="#f0f3ec" font-family="DejaVu Sans, sans-serif">Mixed signs require oscillatory transport</text><circle cx="207" cy="174" r="98" fill="#1b3547" stroke="#648aa0" stroke-width="2"/><path d="M305 174 A98 98 0 0 1 175 266" fill="none" stroke="#9fdef3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="207" y1="174" x2="275" y2="102" stroke="#efc58c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="207" y="177" font-size="17" text-anchor="middle" font-weight="normal" fill="#a9c0cc" font-family="DejaVu Sans, sans-serif">0</text><text x="277" y="96" font-size="21" text-anchor="middle" font-weight="normal" fill="#efc58c" font-family="DejaVu Sans, sans-serif">e^(itω)</text><rect x="380" y="110" width="263" height="127" rx="12" fill="#1b3547" stroke="#648aa0" stroke-width="1.7"/><text x="511" y="151" font-size="24" text-anchor="middle" font-weight="normal" fill="#9fdef3" font-family="DejaVu Sans, sans-serif">|e^(itω)| = 1</text><text x="511" y="200" font-size="19" text-anchor="middle" font-weight="normal" fill="#a9c0cc" font-family="DejaVu Sans, sans-serif">no scalar decay</text></svg>