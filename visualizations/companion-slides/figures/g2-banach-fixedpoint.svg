<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" role="img" aria-label="The Sylvester inverse produces a contraction map with ratio gamma over gamma plus delta"><title>g2 banach fixedpoint</title><desc>The Sylvester inverse produces a contraction map with ratio gamma over gamma plus delta. New diagram authored specifically for the G2 Sylvester lecture companion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#9fdef3"/></marker></defs><text x="36" y="44" font-size="24" text-anchor="start" font-weight="bold" fill="#f0f3ec" font-family="DejaVu Sans, sans-serif">The fixed-point estimate</text><rect x="57" y="102" width="252" height="130" rx="12" fill="#1b3547" stroke="#648aa0" stroke-width="1.7"/><text x="183" y="153" font-size="21" text-anchor="middle" font-weight="normal" fill="#9fdef3" font-family="DejaVu Sans, sans-serif">T ↦ A⁻¹C + A⁻¹TB</text><line x1="313" y1="166" x2="391" y2="166" stroke="#9fdef3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="402" y="102" width="238" height="130" rx="12" fill="#1b3547" stroke="#648aa0" stroke-width="1.7"/><text x="519" y="155" font-size="18" text-anchor="middle" font-weight="normal" fill="#a9c0cc" font-family="DejaVu Sans, sans-serif">contraction ratio</text><text x="519" y="195" font-size="20" text-anchor="middle" font-weight="normal" fill="#efc58c" font-family="DejaVu Sans, sans-serif">q = γ/(γ + δ) &lt; 1</text><text x="347" y="292" font-size="19" text-anchor="middle" font-weight="normal" fill="#a9c0cc" font-family="DejaVu Sans, sans-serif">N(T) ≤ (N(C) + γ N(T)) / (γ + δ)</text></svg>