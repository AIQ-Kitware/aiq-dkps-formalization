<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" role="img" aria-label="Two separate Riesz loops around A spectral points with B at zero between them"><title>g2 rosenblum multiloop</title><desc>Two separate Riesz loops around A spectral points with B at zero between them. New diagram authored specifically for the G2 Sylvester lecture companion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#9fdef3"/></marker></defs><text x="41" y="45" font-size="24" text-anchor="start" font-weight="bold" fill="#f0f3ec" font-family="DejaVu Sans, sans-serif">Several loops may be necessary</text><line x1="77" y1="182" x2="625" y2="182" stroke="#a9c0cc" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="166" cy="182" r="63" fill="none" stroke="#9fdef3" stroke-width="3"/><circle cx="166" cy="182" r="9" fill="#efc58c"/><text x="166" y="220" font-size="18" text-anchor="middle" font-weight="normal" fill="#efc58c" font-family="DejaVu Sans, sans-serif">−2</text><circle cx="532" cy="182" r="63" fill="none" stroke="#9fdef3" stroke-width="3"/><circle cx="532" cy="182" r="9" fill="#efc58c"/><text x="532" y="220" font-size="18" text-anchor="middle" font-weight="normal" fill="#efc58c" font-family="DejaVu Sans, sans-serif">+2</text><circle cx="349" cy="182" r="10" fill="#83ceb8"/><text x="349" y="215" font-size="19" text-anchor="middle" font-weight="normal" fill="#83ceb8" font-family="DejaVu Sans, sans-serif">0 : B</text><text x="166" y="111" font-size="18" text-anchor="middle" font-weight="normal" fill="#9fdef3" font-family="DejaVu Sans, sans-serif">Γ₁</text><text x="532" y="111" font-size="18" text-anchor="middle" font-weight="normal" fill="#9fdef3" font-family="DejaVu Sans, sans-serif">Γ₂</text><text x="349" y="289" font-size="19" text-anchor="middle" font-weight="normal" fill="#a9c0cc" font-family="DejaVu Sans, sans-serif">two A loops, B outside both</text></svg>