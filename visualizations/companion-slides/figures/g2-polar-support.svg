<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="Initial and final support spaces of a partial isometry"><rect width="560" height="270" rx="8" fill="#102231"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#9cd6ef" stroke-width="1.5"/></marker><marker id="goldarrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#f1bf76" stroke-width="1.5"/></marker></defs><text x="140" y="31" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle">source E</text><text x="421" y="31" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle">target F</text><rect x="39" y="53" width="205" height="169" rx="8" fill="#193447" stroke="#3c5a70" stroke-width="1.4"/><rect x="319" y="53" width="205" height="169" rx="8" fill="#193447" stroke="#3c5a70" stroke-width="1.4"/><rect x="57" y="70" width="170" height="59" rx="8" fill="#224758" stroke="#9cd6ef" stroke-width="1.4"/><rect x="57" y="147" width="170" height="57" rx="8" fill="#193447" stroke="#3c5a70" stroke-width="1.4"/><rect x="336" y="70" width="170" height="59" rx="8" fill="#524333" stroke="#f1bf76" stroke-width="1.4"/><rect x="336" y="147" width="170" height="57" rx="8" fill="#193447" stroke="#3c5a70" stroke-width="1.4"/><text x="142" y="103" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle">M = (ker U)⊥</text><text x="142" y="178" fill="#9ab2c0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="middle">ker U</text><text x="421" y="103" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle">N = ran U</text><text x="421" y="178" fill="#9ab2c0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="middle">N⊥</text><line x1="230" y1="101" x2="315" y2="101" stroke="#9cd6ef" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="231" y1="173" x2="295" y2="173" stroke="#9ab2c0" stroke-width="2" stroke-linecap="round"/><text x="272" y="88" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">isometry</text><text x="274" y="191" fill="#9ab2c0" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">zero</text><text x="280" y="254" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="middle">U*U = P_M     ·     UU* = P_N</text><desc>Source decomposition into initial space and kernel, with isometric mapping to the range and zero mapping on the kernel. The adjoint compositions are the support projections.</desc></svg>