t-weight="normal" text-anchor="start">sin</text><circle cx="410" cy="151" r="67" fill="none" stroke="#9ab2c0" stroke-width="2"/><line x1="331" y1="151" x2="489" y2="151" stroke="#9ab2c0" stroke-width="1" stroke-linecap="round"/><line x1="410" y1="230" x2="410" y2="72" stroke="#9ab2c0" stroke-width="1" stroke-linecap="round"/><line x1="410" y1="151" x2="432.9153496028198" y2="88.04059440734414" stroke="#f1bf76" stroke-width="4" stroke-linecap="round" marker-end="url(#goldarrow)"/><circle cx="432.9153496028198" cy="88.04059440734414" r="4" fill="#f1bf76" stroke="#f1bf76" stroke-width="1"/><line x1="410" y1="151" x2="432.9153496028198" y2="151" stroke="#f1bf76" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><line x1="432.9153496028198" y1="151" x2="432.9153496028198" y2="88.04059440734414" stroke="#f18f92" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><text x="410" y="50" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle">λ₂</text><text x="419" y="179" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start">cos</text><text x="442.9153496028198" y="119.52029720367207" fill="#f18f92" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start">sin</text><text x="280" y="259" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="middle">cos² A + sin² A = I</text><desc>Sine and cosine of a self-adjoint matrix act on each eigenspace by scalar trigonometry, with complementary sine and cosine components.</desc></svg>