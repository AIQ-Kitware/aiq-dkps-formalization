<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="Orthogonal retained and escaped components of a source vector"><rect x="0" y="0" width="560" height="270" rx="9" fill="#102131"/><defs><marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#9bdcf2" stroke-width="1.8"/></marker><marker id="g" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#f2c78d" stroke-width="1.8"/></marker></defs><text x="280" y="30" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" fill="#e5ecf0">RETAINED VS LOST COMPONENTS</text><line x1="65" y1="221" x2="503" y2="221" stroke="#9bdcf2" stroke-width="4" stroke-linecap="round"/><line x1="123" y1="248" x2="123" y2="55" stroke="#9ab0be" stroke-width="1.5" stroke-linecap="round"/><line x1="123" y1="221" x2="420" y2="77" stroke="#f2c78d" stroke-width="4" stroke-linecap="round" marker-end="url(#g)"/><line x1="123" y1="221" x2="419" y2="221" stroke="#9bdcf2" stroke-width="3" stroke-linecap="round"/><line x1="419" y1="221" x2="419" y2="77" stroke="#ed9999" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/><circle cx="419" cy="221" r="5" fill="#9bdcf2"/><circle cx="419" cy="77" r="5" fill="#f2c78d"/><text x="440" y="78" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#f2c78d">x ∈ U</text><text x="439" y="223" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#9bdcf2">Qx</text><text x="435" y="150" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" fill="#ed9999">(I−Q)x</text><text x="90" y="244" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#9bdcf2">V</text><text x="227" y="203" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#9bdcf2">retained</text><text x="280" y="260" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#e5ecf0">‖x‖² = ‖Qx‖² + ‖(I−Q)x‖²</text><desc>Projection of a vector x onto the target V splits x into a retained component Qx and an orthogonal loss component (I-Q)x.</desc></svg>