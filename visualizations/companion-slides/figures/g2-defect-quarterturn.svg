<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="Direct rotation on source and target perpendicular defects"><rect x="0" y="0" width="560" height="270" rx="9" fill="#102131"/><defs><marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#9bdcf2" stroke-width="1.8"/></marker><marker id="g" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#f2c78d" stroke-width="1.8"/></marker></defs><text x="280" y="30" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" fill="#e5ecf0">MATCH TWO RIGHT-ANGLE DEFECT SPACES</text><rect x="35" y="59" width="185" height="140" rx="8" fill="#193448" stroke="#3c6175" stroke-width="1.5"/><rect x="340" y="59" width="185" height="140" rx="8" fill="#193448" stroke="#3c6175" stroke-width="1.5"/><text x="127" y="94" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="bold" fill="#9bdcf2">Dₛ</text><text x="127" y="125" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#9bdcf2">U ∩ V⊥</text><text x="432" y="94" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="bold" fill="#f2c78d">Dₜ</text><text x="432" y="125" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#f2c78d">U⊥ ∩ V</text><line x1="224" y1="105" x2="336" y2="105" stroke="#9bdcf2" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><text x="280" y="90" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#9bdcf2">J</text><line x1="337" y1="163" x2="225" y2="163" stroke="#f2c78d" stroke-width="3" stroke-linecap="round" marker-end="url(#g)"/><text x="280" y="181" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#f2c78d">−J*</text><text x="280" y="249" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#e5ecf0">Tⱼ(x,y) = (−J*y, Jx)   ·   quarter-turn</text><desc>An isometry J pairs the source defect Ds to the target defect Dt; the combined skew-adjoint block T_J is a quarter-turn between them.</desc></svg>