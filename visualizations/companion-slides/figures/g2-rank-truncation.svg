dasharray="6 5"/><text x="280" y="266" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#e5ecf0">rank 1: operator error = 2    ·    Frobenius error = √5</text><desc>For singular values 5,2,1, retaining the first mode gives operator error 2 and Frobenius error square root 5.</desc></svg>