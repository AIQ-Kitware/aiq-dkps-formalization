<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" role="img" aria-label="Vectorization converts the Sylvester equation into a Kronecker linear system"><title>g2 kron map</title><desc>Vectorization converts the Sylvester equation into a Kronecker linear system. New diagram authored specifically for the G2 Sylvester lecture companion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#9fdef3"/></marker></defs><text x="37" y="45" font-size="24" text-anchor="start" font-weight="bold" fill="#f0f3ec" font-family="DejaVu Sans, sans-serif">One mn-dimensional linear system</text><rect x="51" y="108" width="153" height="117" rx="12" fill="#1b3547" stroke="#648aa0" stroke-width="1.7"/><text x="127" y="157" font-size="38" text-anchor="middle" font-weight="bold" fill="#9fdef3" font-family="DejaVu Sans, sans-serif">X</text><text x="127" y="197" font-size="17" text-anchor="middle" font-weight="normal" fill="#a9c0cc" font-family="DejaVu Sans, sans-serif">m × n</text><line x1="209" y1="164" x2="305" y2="164" stroke="#9fdef3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="256" y="143" font-size="18" text-anchor="middle" font-weight="normal" fill="#9fdef3" font-family="DejaVu Sans, sans-serif">vec</text><rect x="315" y="108" width="127" height="117" rx="12" fill="#1b3547" stroke="#648aa0" stroke-width="1.7"/><text x="379" y="165" font-size="21" text-anchor="middle" font-weight="normal" fill="#f0f3ec" font-family="DejaVu Sans, sans-serif">vec(X)</text><line x1="446" y1="164" x2="521" y2="164" stroke="#9fdef3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="532" y="108" width="126" height="117" rx="12" fill="#1b3547" stroke="#648aa0" stroke-width="1.7"/><text x="595" y="165" font-size="21" text-anchor="middle" font-weight="normal" fill="#efc58c" font-family="DejaVu Sans, sans-serif">vec(C)</text><text x="353" y="278" font-size="25" text-anchor="middle" font-weight="normal" fill="#efc58c" font-family="DejaVu Sans, sans-serif">Iₙ ⊗ A − Bᵀ ⊗ Iₘ</text></svg>