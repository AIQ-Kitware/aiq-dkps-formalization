<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="WEIGHTED PREFIX DECOMPOSITION"><rect width="560" height="270" rx="9" fill="#102131"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#9bdcf2" stroke-width="1.8"/></marker></defs><text x="280" y="29" fill="#edf4f7" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="bold">WEIGHTED PREFIX DECOMPOSITION</text><rect x="80" y="100" width="125" height="85" rx="5" fill="#1b3547" stroke="#426577" stroke-width="1.4"/><text x="142" y="127" fill="#9bdcf2" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle">ΔS1 = 2</text><text x="142" y="157" fill="#aec2ce" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" text-anchor="middle">a₁−a₂ = 2</text><rect x="245" y="100" width="125" height="85" rx="5" fill="#1b3547" stroke="#426577" stroke-width="1.4"/><text x="307" y="127" fill="#9bdcf2" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle">ΔS2 = 0</text><text x="307" y="157" fill="#aec2ce" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" text-anchor="middle">a₂−a₃ = 1</text><rect x="410" y="100" width="125" height="85" rx="5" fill="#1b3547" stroke="#426577" stroke-width="1.4"/><text x="472" y="127" fill="#f2c78d" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" text-anchor="middle">ΔS3 = 0</text><text x="472" y="157" fill="#aec2ce" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" text-anchor="middle">a₃ = 1</text><text x="280" y="220" fill="#f2c78d" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" text-anchor="middle">2·2 + 1·0 + 1·0 = 4</text><text x="280" y="260" fill="#aec2ce" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" text-anchor="middle">Decreasing weights turn prefix inequalities into weighted bounds</text><desc>Weighted sum difference as a sum of nonnegative prefix gaps.</desc></svg>