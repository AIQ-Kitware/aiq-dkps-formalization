<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="Six-dimensional example with four intersections and one generic plane"><rect width="560" height="270" rx="8" fill="#102231"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#9cd6ef" stroke-width="1.5"/></marker><marker id="goldarrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#f1bf76" stroke-width="1.5"/></marker></defs><text x="280" y="29" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Six independent coordinate directions</text><rect x="25" y="51" width="151" height="69" rx="8" fill="#1d3c4d" stroke="#9cd6ef" stroke-width="1.4"/><text x="45" y="79" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="start">e₁</text><text x="45" y="103" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start">U ∩ V</text><rect x="205" y="51" width="151" height="69" rx="8" fill="#1d3c4d" stroke="#f1bf76" stroke-width="1.4"/><text x="225" y="79" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="start">e₂</text><text x="225" y="103" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start">U only</text><rect x="385" y="51" width="151" height="69" rx="8" fill="#1d3c4d" stroke="#f1bf76" stroke-width="1.4"/><text x="405" y="79" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="start">e₃</text><text x="405" y="103" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start">V only</text><rect x="25" y="135" width="151" height="69" rx="8" fill="#1d3c4d" stroke="#9ab2c0" stroke-width="1.4"/><text x="45" y="163" fill="#9ab2c0" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="start">e₄</text><text x="45" y="187" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start">neither</text><rect x="205" y="135" width="331" height="70" rx="8" fill="#3d352d" stroke="#f1bf76" stroke-width="1.4"/><text x="225" y="164" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="start">span(e₅,e₆)</text><text x="225" y="189" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start">generic principal plane</text><text x="280" y="252" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">U: e₁, e₂, e₅      V: e₁, e₃, cosθ e₅+sinθ e₆</text><desc>For U spanned by e1 e2 e5 and V spanned by e1 e3 and a tilted combination of e5 and e6, the four elementary intersections are axes e1 to e4 and the generic plane is span of e5 e6.</desc></svg>