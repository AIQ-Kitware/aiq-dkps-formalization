<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="Two planes share one principal direction and tilt in another"><rect width="560" height="270" rx="8" fill="#102231"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#9cd6ef" stroke-width="1.5"/></marker><marker id="goldarrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#f1bf76" stroke-width="1.5"/></marker></defs><text x="280" y="31" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Two planes sharing one axis</text><polygon points="100,190 274,220 440,164 264,133" fill="#224758" opacity=".72" stroke="#9cd6ef" stroke-width="2.5"/><polygon points="140,218 282,178 381,51 238,94" fill="#524333" opacity=".58" stroke="#f1bf76" stroke-width="2.5"/><line x1="168" y1="193" x2="331" y2="142" stroke="#9cd6ef" stroke-width="4" stroke-linecap="round"/><line x1="168" y1="193" x2="261" y2="87" stroke="#f1bf76" stroke-width="4" stroke-linecap="round" marker-end="url(#goldarrow)"/><text x="104" y="234" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="start">U</text><text x="355" y="70" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="start">V</text><text x="278" y="247" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">common axis: angle 0</text><text x="420" y="121" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="middle">tilt φ</text><desc>For two two-dimensional subspaces in three-dimensional space sharing one axis, the principal angles are zero and the tilt angle phi.</desc></svg>