<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="Nilpotent matrix exponential sends a square to a parallelogram"><rect width="560" height="270" rx="8" fill="#102231"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#9cd6ef" stroke-width="1.5"/></marker><marker id="goldarrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#f1bf76" stroke-width="1.5"/></marker></defs><text x="145" y="30" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle">original square</text><text x="416" y="30" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle">sheared image</text><line x1="48" y1="227" x2="249" y2="227" stroke="#9ab2c0" stroke-width="1" stroke-linecap="round"/><line x1="75" y1="240" x2="75" y2="50" stroke="#9ab2c0" stroke-width="1" stroke-linecap="round"/><polygon points="105,203 204,203 204,104 105,104" fill="#224758" stroke="#9cd6ef" stroke-width="4"/><line x1="326" y1="227" x2="538" y2="227" stroke="#9ab2c0" stroke-width="1" stroke-linecap="round"/><line x1="347" y1="240" x2="347" y2="50" stroke="#9ab2c0" stroke-width="1" stroke-linecap="round"/><polygon points="373,203 470,203 516,104 419,104" fill="#524333" stroke="#f1bf76" stroke-width="4"/><line x1="220" y1="155" x2="325" y2="155" stroke="#9cd6ef" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="275" y="144" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="middle">e^{tN}</text><text x="145" y="250" fill="#9ab2c0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">(x, y)</text><text x="446" y="250" fill="#9ab2c0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">(x + t y, y)</text><text x="285" y="60" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="middle">N² = 0</text><desc>The matrix N(x,y)=(y,0) has N squared equal zero, so its exponential is I+tN, producing a shear.</desc></svg>