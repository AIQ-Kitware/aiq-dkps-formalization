<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="Principal plane and its cosine sine projection blocks"><rect width="560" height="270" rx="8" fill="#102231"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#9cd6ef" stroke-width="1.5"/></marker><marker id="goldarrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#f1bf76" stroke-width="1.5"/></marker></defs><line x1="83" y1="219" x2="479" y2="219" stroke="#9cd6ef" stroke-width="3" stroke-linecap="round"/><line x1="107" y1="242" x2="107" y2="35" stroke="#9ab2c0" stroke-width="1" stroke-linecap="round"/><line x1="107" y1="219" x2="378" y2="75" stroke="#f1bf76" stroke-width="4" stroke-linecap="round" marker-end="url(#goldarrow)"/><line x1="107" y1="219" x2="107" y2="57" stroke="#9cd6ef" stroke-width="3" stroke-linecap="round"/><path d="M175 219 A68 68 0 0 0 167 187" stroke="#f1bf76" stroke-width="3" fill="none"/><text x="183" y="184" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" text-anchor="start">θ</text><text x="383" y="70" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">v = ce + sf</text><text x="415" y="237" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">e</text><text x="90" y="45" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start">f</text><rect x="309" y="120" width="214" height="80" rx="8" fill="#193447" stroke="#3c5a70" stroke-width="1.4"/><text x="416" y="150" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle">P: [1  0]</text><text x="416" y="175" fill="#f1bf76" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Q: [c²  cs; cs  s²]</text><desc>The line V is spanned by v=c e+s f. Projecting onto e gives diagonal P, and projecting onto v gives Q with entries c squared, cs, and s squared.</desc></svg>