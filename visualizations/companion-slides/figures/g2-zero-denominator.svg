<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" role="img" aria-label="A vanishing spectral denominator imposes compatibility and yields free variables"><title>g2 zero denominator</title><desc>A vanishing spectral denominator imposes compatibility and yields free variables. New diagram authored specifically for the G2 Sylvester lecture companion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#9fdef3"/></marker></defs><text x="39" y="43" font-size="23" text-anchor="start" font-weight="bold" fill="#f0f3ec" font-family="DejaVu Sans, sans-serif">A shared eigenvalue changes solvability</text><rect x="43" y="118" width="288" height="130" rx="12" fill="#1b3547" stroke="#648aa0" stroke-width="1.7"/><rect x="367" y="118" width="288" height="130" rx="12" fill="#1b3547" stroke="#648aa0" stroke-width="1.7"/><text x="185" y="157" font-size="23" text-anchor="middle" font-weight="normal" fill="#ed9d92" font-family="DejaVu Sans, sans-serif">(3 − 3) x = 5</text><text x="185" y="202" font-size="21" text-anchor="middle" font-weight="bold" fill="#ed9d92" font-family="DejaVu Sans, sans-serif">no solution</text><text x="510" y="157" font-size="23" text-anchor="middle" font-weight="normal" fill="#83ceb8" font-family="DejaVu Sans, sans-serif">(3 − 3) x = 0</text><text x="510" y="202" font-size="21" text-anchor="middle" font-weight="bold" fill="#83ceb8" font-family="DejaVu Sans, sans-serif">every x works</text><text x="347" y="291" font-size="17" text-anchor="middle" font-weight="normal" fill="#a9c0cc" font-family="DejaVu Sans, sans-serif">compatibility: C on every shared spectral block must vanish</text></svg>