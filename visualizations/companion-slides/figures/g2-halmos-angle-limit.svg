<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="Positive cosine values with no uniform positive lower bound"><rect width="560" height="270" rx="8" fill="#102231"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#9cd6ef" stroke-width="1.5"/></marker><marker id="goldarrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#f1bf76" stroke-width="1.5"/></marker></defs><text x="280" y="29" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Positive cosines can approach zero</text><line x1="75" y1="208" x2="490" y2="208" stroke="#9ab2c0" stroke-width="2" stroke-linecap="round"/><line x1="75" y1="208" x2="75" y2="65" stroke="#9ab2c0" stroke-width="2" stroke-linecap="round"/><rect x="112" y="87" width="53" height="121" rx="3" fill="#235166" stroke="#9cd6ef" stroke-width="1.4"/><text x="138" y="231" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><rect x="212" y="133" width="53" height="75" rx="3" fill="#235166" stroke="#9cd6ef" stroke-width="1.4"/><text x="238" y="231" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">2</text><rect x="312" y="170" width="53" height="38" rx="3" fill="#235166" stroke="#9cd6ef" stroke-width="1.4"/><text x="338" y="231" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">3</text><rect x="412" y="196" width="53" height="12" rx="3" fill="#235166" stroke="#9cd6ef" stroke-width="1.4"/><text x="438" y="231" fill="#9cd6ef" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">4</text><text x="58" y="73" fill="#9ab2c0" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start">1</text><text x="55" y="211" fill="#9ab2c0" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start">0</text><text x="280" y="258" fill="#dce8ec" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">n increases   ·   cos θₙ &gt; 0 but inf cos θₙ = 0</text><desc>Each bar represents a strictly positive cosine of a principal angle, but along an infinite collection the cosines can approach zero without any one cosine being zero.</desc></svg>