<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="Discrete eigenvalue data contrasted with a continuous spectral interval"><rect x="0" y="0" width="560" height="270" rx="9" fill="#102131"/><defs><marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#9bdcf2" stroke-width="1.8"/></marker><marker id="g" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#f2c78d" stroke-width="1.8"/></marker></defs><text x="280" y="29" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" fill="#e5ecf0">POINT SPECTRUM VS CONTINUOUS SPECTRUM</text><text x="145" y="66" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#9bdcf2">compact diagonal C</text><text x="424" y="66" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#f2c78d">multiplication C</text><line x1="64" y1="151" x2="237" y2="151" stroke="#9ab0be" stroke-width="3" stroke-linecap="round"/><line x1="344" y1="151" x2="520" y2="151" stroke="#9ab0be" stroke-width="3" stroke-linecap="round"/><circle cx="95" cy="151" r="7" fill="#9bdcf2"/><circle cx="128" cy="151" r="7" fill="#9bdcf2"/><circle cx="169" cy="151" r="7" fill="#9bdcf2"/><circle cx="215" cy="151" r="7" fill="#9bdcf2"/><rect x="356" y="139" width="153" height="24" rx="4" fill="#685437" stroke="#f2c78d" stroke-width="1.5"/><text x="151" y="198" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#9bdcf2">isolated eigenvalues</text><text x="431" y="198" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#f2c78d">all values t ∈ [0,1]</text><text x="280" y="252" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" fill="#e5ecf0">An eigenvalue list cannot encode continuous spectrum.</text><desc>Compact diagonal cosine is described by eigenvalues with multiplicity, while multiplication by t on L2(0,1) has continuous spectrum [0,1] and no nonzero eigenvectors.</desc></svg>