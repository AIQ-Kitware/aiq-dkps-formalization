<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" role="img" aria-label="Interlaced A and B spectra with a positive distance but no ordered gap"><title>g2 mixed gap</title><desc>Interlaced A and B spectra with a positive distance but no ordered gap. New diagram authored specifically for the G2 Sylvester lecture companion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#9fdef3"/></marker></defs><text x="41" y="48" font-size="24" text-anchor="start" font-weight="bold" fill="#f0f3ec" font-family="DejaVu Sans, sans-serif">Pairwise separated, but not ordered</text><line x1="64" y1="193" x2="631" y2="193" stroke="#a9c0cc" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="140" cy="193" r="10" fill="#efc58c"/><text x="140" y="231" font-size="18" text-anchor="middle" font-weight="normal" fill="#efc58c" font-family="DejaVu Sans, sans-serif">−2</text><circle cx="539" cy="193" r="10" fill="#efc58c"/><text x="539" y="231" font-size="18" text-anchor="middle" font-weight="normal" fill="#efc58c" font-family="DejaVu Sans, sans-serif">2</text><circle cx="338" cy="193" r="11" fill="#9fdef3"/><text x="338" y="231" font-size="19" text-anchor="middle" font-weight="normal" fill="#9fdef3" font-family="DejaVu Sans, sans-serif">0</text><text x="340" y="110" font-size="19" text-anchor="middle" font-weight="normal" fill="#a9c0cc" font-family="DejaVu Sans, sans-serif">A spectrum lies on both sides of B</text><text x="340" y="284" font-size="18" text-anchor="middle" font-weight="normal" fill="#a9c0cc" font-family="DejaVu Sans, sans-serif">all distances positive; no common left/right cut</text></svg>