<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" role="img" aria-label="Scalar Sylvester division and growth of the inverse for small spectral gaps"><title>g2 scalar gap</title><desc>Scalar Sylvester division and growth of the inverse for small spectral gaps. New diagram authored specifically for the G2 Sylvester lecture companion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#9fdef3"/></marker></defs><text x="37" y="48" font-size="23" text-anchor="start" font-weight="bold" fill="#f0f3ec" font-family="DejaVu Sans, sans-serif">Scalar division controls the matrix equation</text><rect x="52" y="105" width="190" height="103" rx="12" fill="#1b3547" stroke="#648aa0" stroke-width="1.7"/><text x="147" y="150" font-size="23" text-anchor="middle" font-weight="normal" fill="#efc58c" font-family="DejaVu Sans, sans-serif">(a − b) x = c</text><line x1="252" y1="157" x2="438" y2="157" stroke="#9fdef3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="448" y="105" width="204" height="103" rx="12" fill="#1b3547" stroke="#648aa0" stroke-width="1.7"/><text x="550" y="147" font-size="21" text-anchor="middle" font-weight="normal" fill="#9fdef3" font-family="DejaVu Sans, sans-serif">x = c / (a − b)</text><text x="348" y="258" font-size="20" text-anchor="middle" font-weight="normal" fill="#a9c0cc" font-family="DejaVu Sans, sans-serif">as |a − b| → 0, the solution grows</text></svg>