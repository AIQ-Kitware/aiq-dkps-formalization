<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" role="img" aria-label="Two by two mixed-spectrum Sylvester example has delta norm X greater than norm C"><title>g2 counterexample norm</title><desc>Two by two mixed-spectrum Sylvester example has delta norm X greater than norm C. New diagram authored specifically for the G2 Sylvester lecture companion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#9fdef3"/></marker></defs><text x="38" y="45" font-size="22" text-anchor="start" font-weight="bold" fill="#f0f3ec" font-family="DejaVu Sans, sans-serif">Constant one fails for a pairwise operator-norm gap</text><rect x="110" y="111" width="433" height="61" rx="6" fill="#efc58c" stroke="#efc58c" stroke-width="1.7"/><text x="135" y="153" font-size="23" text-anchor="start" font-weight="bold" fill="#142b3a" font-family="DejaVu Sans, sans-serif">δ‖X‖ = 5.162</text><rect x="110" y="199" width="354" height="61" rx="6" fill="#9fdef3" stroke="#9fdef3" stroke-width="1.7"/><text x="135" y="240" font-size="23" text-anchor="start" font-weight="bold" fill="#142b3a" font-family="DejaVu Sans, sans-serif">‖C‖ = 4.243</text><text x="580" y="291" font-size="20" text-anchor="end" font-weight="normal" fill="#a9c0cc" font-family="DejaVu Sans, sans-serif">δ = 1</text></svg>