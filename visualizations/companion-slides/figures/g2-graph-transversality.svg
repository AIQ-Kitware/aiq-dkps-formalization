<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="Graph of an acute subspace over a coordinate subspace"><rect x="0" y="0" width="560" height="270" rx="9" fill="#102131"/><defs><marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#9bdcf2" stroke-width="1.8"/></marker><marker id="g" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#f2c78d" stroke-width="1.8"/></marker></defs><text x="280" y="28" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" fill="#e5ecf0">V = graph(L) over U</text><line x1="64" y1="213" x2="511" y2="213" stroke="#9bdcf2" stroke-width="4" stroke-linecap="round"/><line x1="114" y1="238" x2="114" y2="50" stroke="#9ab0be" stroke-width="1.5" stroke-linecap="round"/><line x1="114" y1="213" x2="463" y2="82" stroke="#f2c78d" stroke-width="4" stroke-linecap="round"/><line x1="345" y1="213" x2="345" y2="126" stroke="#ed9999" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/><circle cx="345" cy="126" r="5" fill="#f2c78d"/><circle cx="345" cy="213" r="4" fill="#9bdcf2"/><text x="327" y="226" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#9bdcf2">u</text><text x="359" y="174" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#ed9999">Lu</text><text x="364" y="113" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#f2c78d">u + Lu</text><path d="M171.1,191.5 A61,61 0 0 1 175.0,213.0" stroke="#f2c78d" stroke-width="3" fill="none"/><text x="187" y="201" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#f2c78d">θ</text><text x="280" y="258" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#e5ecf0">‖L‖ = tan θ on a principal plane</text><desc>A tilted target V consists of vectors u+Lu with u in horizontal U and vertical component Lu; the slope is the tangent of the angle.</desc></svg>