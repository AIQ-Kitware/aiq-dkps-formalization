<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-label="Sine-theta theorem geometry. Orthogonal wanted and unwanted subspaces span E; a nearly aligned trial direction decomposes into their components. Other panels define coordinate maps, the residual and spectral separation.">
  <title>Geometry and notation of the sine-theta theorem</title>
  <desc>Programmatic, two-dimensional rank-one example with theta=12 degrees. The blue wanted and cyan complementary axes jointly span the ambient plane. The amber trial vector lies near the wanted axis and splits into wanted and complementary projections. Three coordinate systems map into the same E.</desc>
  <defs>
    <marker id="tip-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1B1F24" />
    </marker>
    <marker id="tip-trial" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A66705" />
    </marker>
    <marker id="tip-wanted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1F6FD1" />
    </marker>
    <marker id="tip-unwanted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#007C91" />
    </marker>
    <marker id="tip-gap" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E4BD8" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1800" height="1120" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.3" />
  <text x="60.00" y="69.00" fill="#1B1F24" font-size="47" font-weight="700" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">Geometry and Notation of the Sine-Theta Theorem</text>
  <text x="61.00" y="112.00" fill="#6B7280" font-size="23" font-weight="400" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">One ambient space, an exact orthogonal decomposition, and a nearby trial subspace</text>
  <line x1="61.00" y1="136.00" x2="1738.00" y2="136.00" stroke="#D7E0EA" stroke-width="1.5" stroke-linecap="round" />
  <g id="ambient-geometry">
    <title>Exact subspaces span E; a trial line is slightly tilted</title>
    <rect x="55" y="158" width="1070" height="666" rx="20" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1.3" />
    <text x="84.00" y="207.00" fill="#1B1F24" font-size="28" font-weight="700" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">1   Ambient geometry and exact decomposition</text>
    <text x="85.00" y="258.00" fill="#36516A" font-size="32" font-weight="680" text-anchor="start" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="normal">E = ran(F<tspan baseline-shift="sub" font-size="23.36" font-style="normal">0</tspan>) ⊕ ran(F<tspan baseline-shift="sub" font-size="23.36" font-style="normal">1</tspan>)</text>
    <text x="85.00" y="293.00" fill="#6B7280" font-size="19" font-weight="400" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">Every ambient vector has a unique wanted and complementary component.</text>
    <rect x="85" y="315" width="1008" height="482" rx="15" fill="#F4F7FB" stroke="#DEE7F0" stroke-width="1.3" />
    <text x="106.00" y="353.00" fill="#36516A" font-size="30" font-weight="700" text-anchor="start" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="italic">E</text>
    <text x="145.00" y="351.00" fill="#6B7280" font-size="17.5" font-weight="400" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">rank-one model: E = R<tspan baseline-shift="super" font-size="12.78" font-style="normal">2</tspan>
    </text>
    <line x1="167.00" y1="678.00" x2="1032.00" y2="678.00" stroke="#1F6FD1" stroke-width="3.6" stroke-linecap="round" marker-end="url(#tip-wanted)" id="exact-wanted-axis" />
    <line x1="346.00" y1="761.00" x2="346.00" y2="382.00" stroke="#007C91" stroke-width="3.6" stroke-linecap="round" marker-end="url(#tip-unwanted)" id="exact-complement-axis" />
    <line x1="346.00" y1="678.00" x2="858.55" y2="678.00" stroke="#1F6FD1" stroke-width="5.0" stroke-linecap="round" id="wanted-component" />
    <line x1="858.55" y1="678.00" x2="858.55" y2="569.05" stroke="#007C91" stroke-width="4.0" stroke-linecap="round" stroke-dasharray="6 5" id="unwanted-component" />
    <line x1="346.00" y1="678.00" x2="858.55" y2="569.05" stroke="#A66705" stroke-width="5.0" stroke-linecap="round" marker-end="url(#tip-trial)" id="trial-vector" />
    <circle cx="346.00" cy="678.00" r="5.3" fill="#36516A" />
    <circle cx="858.55" cy="569.05" r="7" fill="#A66705" />
    <circle cx="858.55" cy="678.00" r="5.4" fill="#1F6FD1" />
    <path d="M 838.55 678.00 v -20 h 20" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 451.00 678.00 A 105 105 0 0 0 448.71 656.17" fill="none" stroke="#D12A7B" stroke-width="3.0" stroke-linecap="round" />
    <text x="467.00" y="663.00" fill="#D12A7B" font-size="22" font-weight="650" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">θ = 12°</text>
    <text x="369.00" y="393.00" fill="#007C91" font-size="24" font-weight="700" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">ran(F<tspan baseline-shift="sub" font-size="17.52" font-style="normal">1</tspan>)</text>
    <text x="371.00" y="421.00" fill="#6B7280" font-size="17" font-weight="400" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">exact complement</text>
    <text x="930.00" y="663.00" fill="#1F6FD1" font-size="24" font-weight="700" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">ran(F<tspan baseline-shift="sub" font-size="17.52" font-style="normal">0</tspan>)</text>
    <text x="930.00" y="692.00" fill="#6B7280" font-size="17" font-weight="400" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">exact wanted</text>
    <text x="683.00" y="545.00" fill="#A66705" font-size="25" font-weight="700" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">ran(E<tspan baseline-shift="sub" font-size="18.25" font-style="normal">0</tspan>)</text>
    <text x="683.00" y="574.00" fill="#6B7280" font-size="17" font-weight="400" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">trial direction</text>
    <text x="872.55" y="564.05" fill="#A66705" font-size="21" font-weight="650" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">v = E<tspan baseline-shift="sub" font-size="15.33" font-style="normal">0</tspan>(1)</text>
    <text x="876.55" y="627.00" fill="#007C91" font-size="22" font-weight="700" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">S(1)</text>
    <text x="876.55" y="651.00" fill="#6B7280" font-size="17" font-weight="400" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">unwanted part</text>
    <text x="695.00" y="718.00" fill="#1F6FD1" font-size="22" font-weight="650" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">P<tspan baseline-shift="sub" font-size="16.06" font-style="normal">ex</tspan> v</text>
    <text x="696.00" y="744.00" fill="#6B7280" font-size="17" font-weight="400" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">wanted part</text>
    <rect x="105" y="757" width="963" height="31" rx="7" fill="#FFFFFF" stroke="none" stroke-width="1.3" />
    <text x="117.00" y="780.00" fill="#1B1F24" font-size="19" font-weight="550" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">v = P<tspan baseline-shift="sub" font-size="13.87" font-style="normal">ex</tspan> v + (I − P<tspan baseline-shift="sub" font-size="13.87" font-style="normal">ex</tspan>)v    ;    X = F<tspan baseline-shift="sub" font-size="13.87" font-style="normal">1</tspan>
      <tspan baseline-shift="super" font-size="13.87" font-style="normal">∗</tspan>E<tspan baseline-shift="sub" font-size="13.87" font-style="normal">0</tspan> reads off the unwanted coordinates.</text>
  </g>
  <g id="coordinate-embeddings">
    <title>All frames embed separate abstract coordinate spaces into the same E</title>
    <rect x="1145" y="158" width="600" height="666" rx="20" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1.3" />
    <text x="1173.00" y="207.00" fill="#1B1F24" font-size="27" font-weight="700" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">2   Coordinates and embeddings</text>
    <text x="1175.00" y="251.00" fill="#6B7280" font-size="19" font-weight="400" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">The coordinate spaces need not be subsets of E.</text>
    <g id="row-wanted">
      <title>F_ex maps via F₀ to ran(F₀) ⊂ E</title>
      <rect x="1175" y="298" width="540" height="101" rx="13" fill="#EAF2FF" stroke="#1F6FD1" stroke-width="1.3" />
      <text x="1195.00" y="340.00" fill="#1F6FD1" font-size="30" font-weight="650" text-anchor="start" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="italic">F<tspan baseline-shift="sub" font-size="21.90" font-style="normal">ex</tspan>
      </text>
      <line x1="1295.00" y1="336.00" x2="1361.00" y2="336.00" stroke="#1F6FD1" stroke-width="2.6" stroke-linecap="round" marker-end="url(#tip-wanted)" />
      <text x="1326.00" y="326.00" fill="#1F6FD1" font-size="20" font-weight="650" text-anchor="middle" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="normal">F<tspan baseline-shift="sub" font-size="14.60" font-style="normal">0</tspan>
      </text>
      <text x="1382.00" y="342.00" fill="#1F6FD1" font-size="22" font-weight="660" text-anchor="start" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="normal">ran(F<tspan baseline-shift="sub" font-size="16.06" font-style="normal">0</tspan>) ⊂ E</text>
      <text x="1196.00" y="377.00" fill="#6B7280" font-size="17" font-weight="400" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">wanted exact coordinates</text>
    </g>
    <g id="row-unwanted">
      <title>G maps via F₁ to ran(F₁) ⊂ E</title>
      <rect x="1175" y="417" width="540" height="101" rx="13" fill="#E5F6F9" stroke="#007C91" stroke-width="1.3" />
      <text x="1195.00" y="459.00" fill="#007C91" font-size="30" font-weight="650" text-anchor="start" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="italic">G</text>
      <line x1="1295.00" y1="455.00" x2="1361.00" y2="455.00" stroke="#007C91" stroke-width="2.6" stroke-linecap="round" marker-end="url(#tip-unwanted)" />
      <text x="1326.00" y="445.00" fill="#007C91" font-size="20" font-weight="650" text-anchor="middle" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="normal">F<tspan baseline-shift="sub" font-size="14.60" font-style="normal">1</tspan>
      </text>
      <text x="1382.00" y="461.00" fill="#007C91" font-size="22" font-weight="660" text-anchor="start" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="normal">ran(F<tspan baseline-shift="sub" font-size="16.06" font-style="normal">1</tspan>) ⊂ E</text>
      <text x="1196.00" y="496.00" fill="#6B7280" font-size="17" font-weight="400" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">complementary exact coordinates</text>
    </g>
    <g id="row-trial">
      <title>F maps via E₀ to ran(E₀) ⊂ E</title>
      <rect x="1175" y="536" width="540" height="101" rx="13" fill="#FFF4E5" stroke="#A66705" stroke-width="1.3" />
      <text x="1195.00" y="578.00" fill="#A66705" font-size="30" font-weight="650" text-anchor="start" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="italic">F</text>
      <line x1="1295.00" y1="574.00" x2="1361.00" y2="574.00" stroke="#A66705" stroke-width="2.6" stroke-linecap="round" marker-end="url(#tip-trial)" />
      <text x="1326.00" y="564.00" fill="#A66705" font-size="20" font-weight="650" text-anchor="middle" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="normal">E<tspan baseline-shift="sub" font-size="14.60" font-style="normal">0</tspan>
      </text>
      <text x="1382.00" y="580.00" fill="#A66705" font-size="22" font-weight="660" text-anchor="start" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="normal">ran(E<tspan baseline-shift="sub" font-size="16.06" font-style="normal">0</tspan>) ⊂ E</text>
      <text x="1196.00" y="615.00" fill="#6B7280" font-size="17" font-weight="400" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">chosen trial coordinates</text>
    </g>
    <rect x="1175" y="673" width="540" height="113" rx="12" fill="#F6F8FC" stroke="#E4E9F0" stroke-width="1.3" />
    <text x="1192.00" y="703.00" fill="#36516A" font-size="20" font-weight="640" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">F<tspan baseline-shift="sub" font-size="14.60" font-style="normal">ex</tspan> ⊕ G gives exact coordinates for all of E.</text>
    <text x="1192.00" y="736.00" fill="#1B1F24" font-size="19" font-weight="400" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">F instead describes the approximate subspace.</text>
    <text x="1192.00" y="765.00" fill="#6B7280" font-size="18" font-weight="400" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">F need not be the same as F<tspan baseline-shift="sub" font-size="13.14" font-style="normal">ex</tspan>.</text>
  </g>
  <g id="sylvester-mechanism">
    <title>Residual produces the Sylvester equation controlling the unwanted component</title>
    <rect x="55" y="846" width="935" height="229" rx="20" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1.3" />
    <text x="85.00" y="895.00" fill="#1B1F24" font-size="27" font-weight="700" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">3   Residual and the unwanted component</text>
    <text x="86.00" y="936.00" fill="#007C91" font-size="23" font-weight="650" text-anchor="start" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="normal">X = F<tspan baseline-shift="sub" font-size="16.79" font-style="normal">1</tspan>
      <tspan baseline-shift="super" font-size="16.79" font-style="normal">∗</tspan>E<tspan baseline-shift="sub" font-size="16.79" font-style="normal">0</tspan> : F → G</text>
    <text x="518.00" y="936.00" fill="#087D43" font-size="22" font-weight="650" text-anchor="start" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="normal">R = ÂE<tspan baseline-shift="sub" font-size="16.06" font-style="normal">0</tspan> − E<tspan baseline-shift="sub" font-size="16.06" font-style="normal">0</tspan>A<tspan baseline-shift="sub" font-size="16.06" font-style="normal">0</tspan> : F → E</text>
    <line x1="85.00" y1="957.00" x2="962.00" y2="957.00" stroke="#D7E0EA" stroke-width="1.1" stroke-linecap="round" />
    <text x="87.00" y="1000.00" fill="#1B1F24" font-size="29" font-weight="670" text-anchor="start" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="normal">Λ<tspan baseline-shift="sub" font-size="21.17" font-style="normal">1</tspan>X − XA<tspan baseline-shift="sub" font-size="21.17" font-style="normal">0</tspan> = F<tspan baseline-shift="sub" font-size="21.17" font-style="normal">1</tspan>
      <tspan baseline-shift="super" font-size="21.17" font-style="normal">∗</tspan>R</text>
    <text x="87.00" y="1044.00" fill="#D12A7B" font-size="23" font-weight="630" text-anchor="start" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="normal">|X| = sin Θ<tspan baseline-shift="sub" font-size="16.79" font-style="normal">0</tspan>
    </text>
    <text x="408.00" y="1044.00" fill="#1B1F24" font-size="23" font-weight="630" text-anchor="start" font-family="STIXGeneral, 'STIX Math', TeXGyrePagella, serif" font-style="normal">δ N(sin Θ<tspan baseline-shift="sub" font-size="16.79" font-style="normal">0</tspan>) ≤ N(R)</text>
  </g>
  <g id="spectral-separation">
    <title>Concrete ordered spectral gap of the same rank-one model</title>
    <rect x="1010" y="846" width="735" height="229" rx="20" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1.3" />
    <text x="1039.00" y="895.00" fill="#1B1F24" font-size="27" font-weight="700" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">4   Spectral separation</text>
    <text x="1040.00" y="924.00" fill="#6B7280" font-size="18" font-weight="400" text-anchor="start" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">Â = diag(1.9, 0.7),  A<tspan baseline-shift="sub" font-size="13.14" font-style="normal">0</tspan> = ρ,  Λ<tspan baseline-shift="sub" font-size="13.14" font-style="normal">1</tspan> = 0.7</text>
    <line x1="1065.00" y1="1016.00" x2="1682.00" y2="1016.00" stroke="#36516A" stroke-width="2" stroke-linecap="round" marker-end="url(#tip-ink)" />
    <line x1="1180.69" y1="1004.00" x2="1180.69" y2="1028.00" stroke="#007C91" stroke-width="4" stroke-linecap="round" />
    <circle cx="1180.69" cy="1016.00" r="5.6" fill="#007C91" />
    <line x1="1623.43" y1="1004.00" x2="1623.43" y2="1028.00" stroke="#A66705" stroke-width="4" stroke-linecap="round" />
    <circle cx="1623.43" cy="1016.00" r="5.6" fill="#A66705" />
    <text x="1180.69" y="1047.00" fill="#007C91" font-size="18" font-weight="650" text-anchor="middle" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">λ<tspan baseline-shift="sub" font-size="13.14" font-style="normal">1</tspan> = 0.7</text>
    <text x="1623.43" y="1047.00" fill="#A66705" font-size="18" font-weight="650" text-anchor="middle" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">ρ ≈ 1.848</text>
    <path d="M 1180.69 974 V 963 H 1623.43 V 974" fill="none" stroke="#6E4BD8" stroke-width="2.6" stroke-linecap="round" />
    <text x="1402.06" y="953.00" fill="#6E4BD8" font-size="20" font-weight="690" text-anchor="middle" font-family="TeXGyrePagella, 'TeX Gyre Pagella', STIXGeneral, serif" font-style="normal">δ ≈ 1.148</text>
  </g>
</svg>