[project]
name = "dkps-visualizations"
version = "0.1.0"
description = "Executable geometric visualizations for the Davis--Kahan formalization"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0",
  "networkx>=3.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
align = [
  "torch>=2.8,<2.9",
  "transformers>=4.51,<5",
  "num2words>=0.5",
]
serve = [
  "starlette>=1.5.1",
  "uvicorn>=0.35",
]
vtk = [
  "vtk>=9.3",
]
manim = [
  "manim>=0.19",
]
slides = [
  "manim>=0.19",
  "manim-slides>=5.1",
]
test = [
  "pytest>=8",
  "httpx2>=2.0",
]
all = [
  "starlette>=1.5.1",
  "uvicorn>=0.35",
  "vtk>=9.3",
  "manim>=0.19",
  "manim-slides>=5.1",
  "pytest>=8",
  "httpx2>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

# Alignment runs locally on CPU; do not pull a CUDA runtime for this optional task.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "align", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
