[project]
name = "dkps-visualizations"
version = "0.1.0"
description = "Executable geometric visualizations for the Davis--Kahan formalization"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0",
  "networkx>=3.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
serve = [
  "starlette>=1.5.1",
  "uvicorn>=0.35",
]
vtk = [
  "vtk>=9.3",
]
manim = [
  "manim>=0.19",
]
slides = [
  "manim>=0.19",
  "manim-slides>=5.1",
]
test = [
  "pytest>=8",
  "httpx2>=2.0",
]
all = [
  "starlette>=1.5.1",
  "uvicorn>=0.35",
  "vtk>=9.3",
  "manim>=0.19",
  "manim-slides>=5.1",
  "pytest>=8",
  "httpx2>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
