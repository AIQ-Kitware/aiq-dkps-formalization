# Stable IDs, teaching dependencies, and preferred order for independent topics.
# Numbers and directory paths are inferred, not maintained here.
lectures:
  basics:
    title: Before the series — a mathematics refresher
    deck: prereq-basics
    topic: basics
    series: prerequisites
    background: School algebra; a refresher rather than a first course
    requires: []
  history_overview:
    title: How eigenvector stability became a subject
    deck: history-overview
    topic: history
    series: history
    background: Familiarity with vectors and eigenvectors; notation is recalled locally
    requires: []
  projections:
    title: Subspaces and projections
    deck: prereq-projections
    topic: projections
    series: prerequisites
    requires: [basics]
  complementary_projection:
    title: Thinking about I minus P
    deck: prereq-complementary-projection
    topic: complementary_projection
    series: prerequisites
    requires: [projections]
  singular_norms:
    title: Singular values and displacement cost
    deck: prereq-singular-norms
    topic: singular_norms
    series: prerequisites
    requires: [projections]
  matrix_exponential:
    title: The exponential of a matrix
    deck: prereq-matrix-exponential
    topic: matrix_exponential
    series: prerequisites
    requires: [projections]
  minmax:
    title: Rayleigh quotients, min-max, and eigenvalue stability
    deck: operators-minmax
    topic: operators
    series: operators
    requires: [projections, singular_norms]
  polar:
    title: Operator absolute value and polar decomposition
    deck: operators-polar
    topic: operators
    series: operators
    requires: [projections, singular_norms]
  variations:
    title: Feasible variations and stationarity
    deck: prereq-variations
    topic: variations
    series: prerequisites
    requires: [projections, singular_norms, matrix_exponential]
  sylvester:
    title: Sylvester equations and spectral separation
    deck: operators-sylvester
    topic: operators
    series: operators
    requires: [minmax, matrix_exponential]
  sine_theta:
    title: Davis–Kahan sine theta — residuals and spectral separation
    deck: sine-theta-lecture
    topic: sine_theta
    series: spectral_perturbation
    requires: [sylvester, complementary_projection]
  matching_study:
    title: The matching proof, a learner's walkthrough
    deck: matching-proof
    topic: matching
    requires: [variations]
  matching_proof:
    title: The matching proof, a compact presentation
    deck: matching-proof-talk
    topic: matching
    requires: [variations]
