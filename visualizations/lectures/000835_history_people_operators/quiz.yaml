questions:
- title: What does a portrait date tell us?
  question: A portrait of Kato or Kahan was made after the publication discussed. What does it establish?
  choices:
  - The exact setting in which the earlier theorem was proved.
  - The identity of the depicted person, not the date of the mathematical work.
  - That every mathematical claim on the slide is proved.
  correct: 1
  explanation: Portrait and publication are distinct sources, with different dates and evidential roles.
  think_seconds: 5
  speak_question: 'First question. What does a later portrait establish? A: the exact setting where an
    earlier theorem was proved. B: the identity of the person, not the date of the work. Or C: that every
    mathematical claim is proved. Take five seconds.'
  speak_answer: B is correct. The portrait identifies the person. The publication separately anchors the
    mathematical work in time.
- title: How should we read a shared name?
  question: What is the responsible way to interpret a mathematical name or a shared topic?
  choices:
  - Assume everyone named worked together.
  - Attribute the whole subject to the best-known later author.
  - Check the specific publications and documented relationships.
  correct: 2
  explanation: A compound name, a later exposition, and a documented collaboration are different things.
  think_seconds: 5
  speak_question: 'Second question. How should we interpret a shared mathematical name or topic? A: assume
    everyone worked together. B: give the whole subject to the best-known later author. Or C: check the
    specific publications and documented relationships. Take five seconds.'
  speak_answer: C is correct. Names guide us toward sources, but do not replace those sources. Distinguish
    collaboration, separate contributions, and later exposition.
- title: Portrait and publication
  question: Kato’s portrait shown here dates from 1988, while the first edition discussed is from 1966.
    What does the portrait establish?
  choices:
  - How Kato looked when the 1966 book appeared.
  - The identity of the person; publication evidence supplies the book’s date and scope.
  - That the book first appeared in 1988.
  correct: 1
  explanation: A portrait identifies a person. It is not automatically a picture from the date of the
    work being discussed.
  think_seconds: 5
  speak_question: Question 3. Kato’s portrait shown here dates from 1988, while the first edition discussed
    is from 1966. What does the portrait establish? A, How Kato looked when the 1966 book appeared. B,
    The identity of the person; publication evidence supplies the book’s date and scope. C, That the book
    first appeared in 1988. You have five seconds. Pause for longer if needed.
  speak_answer: The answer is B. A portrait identifies a person. It is not automatically a picture from
    the date of the work being discussed.
- title: Reliability has two questions
  question: Suppose a computed matrix eigenvector changes greatly after a tiny change in the input. What
    should be investigated?
  choices:
  - Only whether the arithmetic was performed accurately.
  - Both sensitivity of the mathematical problem and error introduced by the computation.
  - Only whether the matrix entries were stored in a different order.
  correct: 1
  explanation: Even accurate arithmetic cannot remove sensitivity inherent in the problem. Numerical reliability
    requires distinguishing the two issues.
  think_seconds: 5
  speak_question: Question 4. Suppose a computed matrix eigenvector changes greatly after a tiny change
    in the input. What should be investigated? A, Only whether the arithmetic was performed accurately.
    B, Both sensitivity of the mathematical problem and error introduced by the computation. C, Only whether
    the matrix entries were stored in a different order. You have five seconds. Pause for longer if needed.
  speak_answer: The answer is B. Even accurate arithmetic cannot remove sensitivity inherent in the problem.
    Numerical reliability requires distinguishing the two issues.
