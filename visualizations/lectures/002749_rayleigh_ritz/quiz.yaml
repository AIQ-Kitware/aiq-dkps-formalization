questions:
- title: What does trial mean?
  question: Choosing a trial subspace guarantees which statement?
  choices:
  - A maps the space into itself.
  - The space is where we search for approximate eigenvectors.
  - The space is close to the wanted exact spectral subspace.
  correct: 1
  explanation: A trial space is a search choice. Invariance and closeness need separate
    evidence.
  think_seconds: 5
  speak_question: 'First question. Choosing a trial subspace guarantees which statement?
    A: A maps the space into itself. B: the space is where we search for approximate
    eigenvectors. Or C: the space is close to the wanted exact spectral subspace.
    Take five seconds.'
  speak_answer: B is correct. Trial describes where we search, not a guarantee of
    invariance or accuracy.
- title: An error vector and its projection
  question: A candidate $(\theta,u)$ has error $r=Au-\theta u\ne0$. The columns of
    $Q$ form an orthonormal basis of the trial space. What does $Q^Tr=0$ mean?
  choices:
  - $r$ is perpendicular to every vector in the trial space.
  - $r$ is the zero vector.
  - At least one entry of $r$ must be zero in the original coordinates.
  correct: 0
  explanation: The projection of $r$ is zero, not $r$ itself. For example, $Q=(1,1)^T/\sqrt2$
    and $r=(1,-1)^T$ give $Q^Tr=0$ although both entries of $r$ are nonzero.
  think_seconds: 5
  speak_question: 'Second question. Our candidate is theta and u. Its nonzero error
    is r equals A u minus theta u. Q has orthonormal columns spanning the trial space.
    What does Q transpose r equals zero mean? A: r is perpendicular to every trial
    vector. B: r is zero. Or C: at least one entry of r must be zero in the original
    coordinates. Take five seconds.'
  speak_answer: A is correct. Q transpose r records the components along the trial
    directions. They are zero, so r is perpendicular to the trial space. This does
    not force particular entries in the original coordinates to vanish. For example,
    the line through one, one is perpendicular to the vector one, minus one, even
    though both entries of that vector are nonzero.
- title: One exact Ritz vector
  question: Rayleigh–Ritz on a trial plane gives independent candidates $u_1,u_2$
    with errors $r_i=Au_i-\theta_i u_i$. If $r_1=0$ and $r_2\ne0$, what follows?
  choices:
  - The trial plane is invariant because it contains an exact eigenvector.
  - The first candidate spans an invariant line, but the trial plane is not invariant.
  - Changing the small model can make both residuals zero without changing the plane.
  correct: 1
  explanation: Zero residual makes that Ritz vector exact. The other residual shows
    that A sends some vector in the plane outside it; changing an internal model cannot
    remove this leakage.
  think_seconds: 5
  speak_question: 'Third question. Two independent Ritz vectors span our trial plane.
    Each has an error r equal to A u minus theta u for its own pair. The first error
    is zero and the second is nonzero. What follows? A: the plane is invariant because
    it contains an exact eigenvector. B: the first candidate spans an invariant line,
    but the plane is not invariant. Or C: changing the small model can make both errors
    zero without changing the plane. Take five seconds.'
  speak_answer: B is correct. Invariance must hold for every vector in the plane.
    One exact direction is insufficient. The nonzero residual witnesses output outside
    the plane, and an internal model cannot cancel that perpendicular component.
- title: New coordinates, same trial space
  question: $Q$ has $k$ orthonormal columns and $B=Q^TAQ$. Replace $Q$ by $QZ$ with
    a $k\times k$ orthogonal matrix $Z$. What changes?
  choices:
  - The trial subspace changes because its basis columns changed.
  - $B$ remains entrywise identical for every orthogonal $Z$.
  - The small matrix becomes $Z^TBZ$; its eigenvalues and corresponding eigenspaces
    in the original space are unchanged.
  correct: 2
  explanation: '$QZ$ spans the same trial space. Its small matrix is $Z^TBZ$. Replacing
    $y$ by $Z^Ty$ gives the same original-space vector: $QZ(Z^Ty)=Qy$.'
  think_seconds: 5
  speak_question: 'Fourth question. Q has k orthonormal columns, and B equals Q transpose
    A Q. Replace Q by Q Z, where Z is a k by k orthogonal matrix. What changes? A:
    the trial subspace changes because its basis columns changed. B: B keeps identical
    entries for every orthogonal Z. Or C: the small matrix becomes Z transpose B Z,
    and its eigenvalues and corresponding original-space eigenspaces are unchanged.
    Take five seconds.'
  speak_answer: C is correct. We changed coordinates, not the search space. The small
    matrix changes by orthogonal conjugation. Replacing a small eigenvector y by Z
    transpose y gives the same vector in the original space. Within a repeated eigenspace
    the basis can change, but the space itself is unchanged.
