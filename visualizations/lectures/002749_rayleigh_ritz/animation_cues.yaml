# Phrase cues schedule visual events without splitting speech generation.
scenes:
  RrFrame:
    1:
    - visual_at: 0
      phrase: The moving dots represent the same vector
    2:
    - visual_at: 0
      phrase: The cyan vector v illustrates that possibility
  RrCompress:
    2:
    - visual_at: 0
      phrase: Applying A gives the cyan arrow
    3:
    - visual_at: 0
      phrase: Q transpose gives the trial coordinates
    4:
    - visual_at: 0
      phrase: The green arrow completes the trip
  RrQuotient:
    1:
    - visual_at: 0
      phrase: The amber arrow moves through those directions
    2:
    - visual_at: 0
      phrase: Replacing u by Q y
    - visual_at: 1
      phrase: The middle factor is B
    - visual_at: 2
      phrase: Both calculations give the same curve
    3:
    - visual_at: 0
      phrase: Symmetry is preserved too
    - visual_at: 1
      phrase: The maximum is three
    - visual_at: 2
      phrase: the minimum is one
  RrSolve:
    1:
    - visual_at: 0
      phrase: The difference direction
    2:
    - visual_at: 0
      phrase: The amber arrow u equals Q y
    3:
    - visual_at: 0
      phrase: The full operator gives the cyan output
    - visual_at: 1.2
      phrase: The green difference
  RrGeometry:
    2:
    - visual_at: 0
      phrase: Its discarded output is the upward green arrow
    3:
    - visual_at: 0
      phrase: Its green arrow points the other way
    4:
    - visual_at: 0
      phrase: Equal positive input coordinates
  RrExample:
    2:
    - visual_at: 0
      phrase: After lifting
    3:
    - visual_at: 0
      phrase: Its Ritz value is one
  RrBlock:
    2:
    - visual_at: 0
      phrase: The two green arrows give
    - visual_at: 2
      phrase: Together they form C
    - visual_at: 3
      phrase: The D block starts
    - visual_at: 4
      phrase: The upper-right block is C transpose
    3:
    - visual_at: 0
      phrase: Invariance requires every perpendicular output
  RrSetup:
    1:
    - visual_at: 0
      phrase: The original operator A
    - visual_at: 1
      phrase: The trial space is the collection
    - visual_at: 2
      phrase: The frame Q supplies coordinates
  RrOutcomes:
    1:
    - visual_at: 0
      phrase: The small model keeps the projected output
    - visual_at: 1
      phrase: Its eigenvectors and eigenvalues give candidates
    - visual_at: 2
      phrase: The remaining error is perpendicular
  RrPreview:
    1:
    - visual_at: 0
      phrase: Applying A produces the blue output
    - visual_at: 1
      phrase: The amber output is the part retained
    2:
    - visual_at: 0
      phrase: Now suppose the small matrix has an eigenvector
    - visual_at: 1
      phrase: This scalar is a Ritz value
    - visual_at: 2
      phrase: The green difference r equals
  RrSummary:
    1:
    - visual_at: 0
      phrase: First the small model keeps the projected output
    - visual_at: 1
      phrase: Second the small eigenproblem gives candidates
    2:
    - visual_at: 0
      phrase: Third the remaining error is perpendicular
