# Source-time offsets split an existing Manim build; phrases anchor each part
# to the measured recording, without splitting its TTS generation.
scenes:
  RrFrame:
    1:
      - {visual_at: 0, phrase: "The moving dots represent the same vector"}
    2:
      - {visual_at: 0, phrase: "The cyan vector v illustrates that possibility"}
  RrCompress:
    2:
      - {visual_at: 0, phrase: "Applying A gives the cyan arrow"}
    3:
      - {visual_at: 0, phrase: "Q transpose gives the trial coordinates"}
    4:
      - {visual_at: 0, phrase: "The green arrow completes the trip"}
  RrQuotient:
    1:
      - {visual_at: 0, phrase: "The unit coordinate vector turns around the trial plane"}
    2:
      - {visual_at: 0, phrase: "The full and compressed calculations give the same curve"}
    3:
      - {visual_at: 0, phrase: "Symmetry is preserved too"}
  RrSolve:
    1:
      - {visual_at: 0, phrase: "The difference direction"}
    2:
      - {visual_at: 0, phrase: "The amber arrow u equals Q y"}
    3:
      - {visual_at: 0, phrase: "The full operator gives the cyan output"}
      - {visual_at: 1.2, phrase: "The green difference"}
  RrGeometry:
    2:
      - {visual_at: 0, phrase: "Its discarded output is the upward green arrow"}
    3:
      - {visual_at: 0, phrase: "Its green arrow points the other way"}
    4:
      - {visual_at: 0, phrase: "Equal positive input coordinates"}
  RrExample:
    2:
      - {visual_at: 0, phrase: "After lifting"}
    3:
      - {visual_at: 0, phrase: "Its Ritz value is one"}
  RrBlock:
    2:
      - {visual_at: 0, phrase: "The two green arrows supply them"}
      - {visual_at: 2, phrase: "Together they form C"}
    3:
      - {visual_at: 0, phrase: "Every perpendicular output would have to vanish"}
