title: Rayleigh–Ritz — trial spaces, compression, and residuals
intro: Projection explains the smaller problem; the final note connects its eigenpairs to the residual
  in the original space.
checked_on: '2026-11-06'
curated_by: GPT-6.1-Sol
resources:
