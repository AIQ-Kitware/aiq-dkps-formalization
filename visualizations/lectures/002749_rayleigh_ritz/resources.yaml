  url: https://ocw.mit.edu/courses/18-06sc-linear-algebra-fall-2011/pages/least-squares-determinants-and-eigenvalues/projections-onto-subspaces/
  kind: University video lesson
  why: Understand why the nearest point in a subspace leaves an error perpendicular to that subspace.
