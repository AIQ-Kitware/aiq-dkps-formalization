- title: Rayleigh–Ritz method
  url: https://en.wikipedia.org/wiki/Rayleigh%E2%80%93Ritz_method
  kind: Wikipedia topic page
  why: See how choosing a trial basis turns an eigenvalue problem into a smaller matrix problem.
  focus: For matrix eigenvalue problems and its example; separate the trial-space choice from solving
    the compressed problem.
- title: Large-scale eigensolvers — David Bindel, Cornell
  url: https://www.cs.cornell.edu/courses/cs6210/2025fa/lec/2025-12-01.html
